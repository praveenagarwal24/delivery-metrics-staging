<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery Metrics — Images</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="engine-360.js"></script>
<style>
:root{
  --canvas:#ECEFEE; --panel:#FFFFFF; --panel-sunk:#F4F6F5;
  --ink:#0F1E1C; --ink-2:#334744; --muted:#6B7B78; --hair:#DCE3E1; --hair-strong:#C4CFCC;
  --teal:#12706B; --teal-soft:#E3EFEE; --deep:#0C2E2C;
  --up:#1B7A46; --down:#B3261E; --flat:#7A8683; --orange:#D97706;
  --s1:#12706B; --s2:#2C5F8A; --s3:#7A3E6D; --s4:#A5761B; --s5:#55636B;
  --r-card:10px; --r-panel:14px; --r-pill:999px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--canvas); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums lining-nums}
button{font:inherit;color:inherit;cursor:pointer}
select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
.wrap{max-width:1520px;margin:0 auto;padding:0 24px 64px}

/* ---------- masthead ---------- */
.mast{background:var(--deep);color:#E7EFEE;position:sticky;top:0;z-index:40;
  transition:box-shadow .16s ease}
.mast.compact{box-shadow:0 6px 18px rgba(12,46,44,.22)}
.mast.compact .mast-in{padding-top:11px}
.mast.compact h1{font-size:17px}
.mast.compact p{display:none}
.mast.compact .prods{padding-top:9px}
.mast.compact .prod{padding:7px 18px 9px}
.mast-in{max-width:1520px;margin:0 auto;padding:20px 24px 0;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between}
.mast h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.01em;color:#fff}
.mast p{margin:3px 0 0;font-size:13px;color:#9DB4B1;max-width:62ch}
.sync{display:flex;align-items:center;gap:14px;padding-bottom:14px;line-height:1}
.sync-txt{font-size:12px;color:#9DB4B1;display:inline-flex;align-items:center;line-height:1}
.btn{background:#17423F;border:1px solid #2C5A56;color:#DCEAE8;padding:8px 16px;border-radius:var(--r-pill);font-size:13px;font-weight:500;line-height:1}
.btn:hover{background:#1E514D}
.btn[disabled]{opacity:.55;cursor:progress}
.dot{width:7px;height:7px;border-radius:50%;background:#3FBF8F;display:inline-block;margin-right:7px;flex:0 0 auto}
.dot.err{background:#E0705F}

/* product tabs */
.prods{max-width:1520px;margin:0 auto;padding:16px 24px 0;display:flex;gap:2px}
.prod{background:transparent;border:0;border-bottom:2px solid transparent;padding:9px 18px 11px;color:#8FA9A6;font-weight:500;display:flex;align-items:center;gap:9px}
.prod:hover{color:#D6E5E3}
.prod[aria-selected="true"]{color:#fff;border-bottom-color:#3FBF8F}
.prod .tag{font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:2px 7px;border-radius:var(--r-pill);background:#1D4A47;color:#8FB7B3}
.prod[aria-selected="true"] .tag{background:#2A5F5B;color:#BFE0DC}

/* ---------- controls ---------- */
.controls{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;
  position:sticky;top:var(--mastH,152px);z-index:30;background:var(--canvas);
  margin:0 -24px;padding:16px 24px 15px;border-bottom:1px solid var(--hair-strong)}
@media (max-height:620px){.mast,.controls{position:static}}
.ctl{display:flex;align-items:center;gap:8px}
.ctl > span{font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;background:var(--panel-sunk);border:1px solid var(--hair);border-radius:var(--r-pill);padding:2px}
.seg button{border:0;background:transparent;padding:5px 13px;border-radius:var(--r-pill);font-size:12.5px;color:var(--ink-2);font-weight:450}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(15,30,28,.12)}
select.inp{background:var(--panel);border:1px solid var(--hair-strong);border-radius:7px;padding:6px 10px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--hair-strong);background:var(--panel);border-radius:var(--r-pill);padding:4px 11px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.chip-sm{padding:3px 10px;font-size:12px}
.chip-r{display:inline-flex;align-items:center;gap:6px}
.chip-r[aria-pressed="true"] .swatch{box-shadow:0 0 0 1.5px rgba(255,255,255,.6)}
.sec-tools{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:500}
.linky{background:none;border:0;color:var(--teal);font-size:12.5px;text-decoration:underline;padding:0}
/* Source dropdown (360), the same control as the 360 dashboard's Reports tab */
.msel{position:relative}
.msel-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--hair-strong);background:var(--panel);border-radius:7px;padding:5px 10px;font-size:13px;color:var(--ink-2);min-width:150px;justify-content:space-between;cursor:pointer}
.msel-btn svg{flex:0 0 auto;opacity:.7}
.msel-pill{font-size:11px;background:var(--panel-sunk);border:1px solid var(--hair-strong);border-radius:999px;padding:0 6px;margin-left:4px;color:var(--muted)}
.msel-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:60;background:var(--panel);border:1px solid var(--hair-strong);border-radius:10px;box-shadow:0 8px 24px rgba(12,46,44,.16);padding:8px;min-width:210px}
.msel-acts{display:flex;gap:14px;padding:2px 4px 8px;margin-bottom:4px;border-bottom:1px solid var(--hair-strong)}
.msel-pop label{display:flex;align-items:center;gap:8px;padding:5px 4px;font-size:13px;color:var(--ink-2);cursor:pointer;border-radius:6px}
.msel-pop label:hover{background:var(--panel-sunk)}

/* ---------- section headings ---------- */
.sec{margin:30px 0 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sec h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.005em}
.sec .note{font-size:12.5px;color:var(--muted)}
.sec-sel{height:32px;border:1px solid var(--hair-strong);border-radius:7px;padding:0 8px;font:inherit;font-size:12.5px;background:var(--panel);color:var(--ink)}

/* ---------- glance grid ---------- */
.lanes{display:grid;grid-template-columns:repeat(var(--lanes,3),minmax(0,1fr));gap:14px 18px;align-items:stretch}
.lane-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px 2px;align-self:end}
.lane-hd h3{margin:0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.swatch{width:9px;height:9px;border-radius:2px;display:inline-block}
.lane-hd .sub{font-size:12px;color:var(--muted)}
.cards{display:grid;gap:10px}
.card{background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-card);padding:12px 14px 8px;
  display:flex;flex-direction:column;height:100%}
.card .spark{margin-top:auto}
.card-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card-top .name{font-size:13px;font-weight:600;color:var(--ink-2)}
.val{font-size:17.25px;font-weight:600;letter-spacing:-.02em}
.delta{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:var(--r-pill);white-space:nowrap}
.delta.up{background:#E4F1E9;color:var(--up)}
.delta.down{background:#FBE7E5;color:var(--down)}
.delta.flat{background:var(--panel-sunk);color:var(--flat)}
.card .cmp{font-size:11.5px;color:var(--muted);margin-top:-2px}
.spark{margin-top:6px}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-panel);padding:18px}
.panel-hd{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.panel-hd h3{margin:0;font-size:14px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}
.legend span{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse}
th,td{text-align:right;padding:8px 10px;font-size:12.5px;border-bottom:1px solid var(--hair)}
th{font-size:11.5px;color:var(--muted);font-weight:600;background:var(--panel-sunk);position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
tbody tr.clickable:hover{background:var(--teal-soft);cursor:pointer}
tbody tr[aria-selected="true"]{background:var(--teal-soft);box-shadow:inset 2px 0 0 var(--teal)}
.scroll{overflow:auto;max-height:460px;border:1px solid var(--hair);border-radius:var(--r-card)}
.heat{border-radius:5px;padding:6px 4px;display:block;width:100%;text-align:center;font-weight:500}
.matrix{table-layout:fixed}
.matrix th,.matrix td{text-align:center;padding:6px 7px}
.matrix th:first-child,.matrix td:first-child{text-align:left;width:150px;padding-left:12px}
.hide-x{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:0 2px;border-radius:4px;opacity:0;transition:opacity .12s}
.card:hover .hide-x,.hide-x:focus-visible{opacity:1}
.hide-x:hover{color:var(--ink);background:var(--panel-sunk)}
.state--full{min-height:calc(100vh - 300px);display:flex;flex-direction:column;align-items:center;justify-content:center}
.legend-btn{display:flex;align-items:center;gap:7px;background:none;border:0;padding:3px 2px;font-size:12.5px;color:var(--ink-2)}
.legend-btn[aria-pressed="false"]{opacity:.4;text-decoration:line-through}
.rec-tabs{display:flex;gap:2px}
.rec-tabs button{border:0;background:transparent;padding:6px 13px;border-radius:7px;font-size:13px;color:var(--muted)}
.rec-tabs button[aria-pressed="true"]{background:var(--teal-soft);color:var(--teal);font-weight:600}
.search{border:1px solid var(--hair-strong);border-radius:7px;padding:6px 10px;font-size:13px;width:190px;font-family:inherit}

/* ---------- states ---------- */
.state{border:1px dashed var(--hair-strong);border-radius:var(--r-panel);padding:40px 28px;text-align:center;color:var(--muted);background:var(--panel-sunk)}
.state h3{margin:0 0 6px;color:var(--ink);font-size:15px;font-weight:600}
.state p{margin:0 auto;max-width:52ch;font-size:13px}
.state .btn{background:var(--teal);border-color:var(--teal);color:#fff;margin-top:16px}
.state .btn:hover{background:#0E5D59}
.soon{background:repeating-linear-gradient(135deg,#F4F6F5,#F4F6F5 14px,#EFF3F2 14px,#EFF3F2 28px)}
.tip{position:fixed;pointer-events:none;background:var(--deep);color:#EAF2F1;padding:7px 10px;border-radius:7px;font-size:12px;opacity:0;transition:opacity .1s;z-index:50;white-space:nowrap}
.tip b{color:#fff}
.gate{min-height:calc(100vh - 96px);display:flex;align-items:center;justify-content:center;padding:24px}
.gate[hidden]{display:none}
.gate-card{background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-panel);
  padding:40px 36px;max-width:430px;width:100%;text-align:center}
.gate-card h2{margin:0 0 8px;font-size:19px;font-weight:600}
.gate-card p{margin:0 0 22px;font-size:13.5px;color:var(--muted);line-height:1.55}
.gsi-slot{display:flex;justify-content:center;min-height:44px}
.gate-err{margin:18px 0 0!important;color:var(--down);font-size:13px}
.who{display:flex;align-items:center;gap:10px;line-height:1}
.who:not(:empty)::after{content:"";width:1px;height:16px;background:#2C5A56;margin-left:4px}
.who-mail{font-size:12px;color:#9DB4B1;line-height:1}
.role{font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:4px 9px;border-radius:var(--r-pill);
  background:#2A5F5B;color:#BFE0DC;text-transform:uppercase;line-height:1}
.role.admin{background:#3FBF8F;color:#0C2E2C}
.linky-dark{background:none;border:0;color:#9DB4B1;font-size:12px;text-decoration:underline;padding:0;line-height:1}
.linky-dark:hover{color:#DCEAE8}
.admin-tag{font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:var(--r-pill);
  background:var(--teal-soft);color:var(--teal);text-transform:uppercase;margin-left:8px}
.rlegend{display:flex;flex-wrap:wrap;gap:5px;padding:0 4px 11px}
.rchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair-strong);background:var(--panel);
  border-radius:var(--r-pill);padding:3px 9px;font-size:11.5px;color:var(--ink-2);line-height:1}
.rchip[aria-pressed="false"]{opacity:.42}
.rchip[aria-pressed="false"] .swatch{background:var(--flat)!important}
.rgrid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:18px;align-items:stretch}
.rcard{display:flex;flex-direction:column}
.progs{list-style:none;margin:10px 0 4px;padding:0;max-height:none}
.progs li{padding:9px 0;border-top:1px solid var(--hair);font-size:13px;color:var(--ink-2);line-height:1.45}
.progs li:first-child{border-top:0}
.progs li::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--teal);margin-right:9px;vertical-align:2px}
@media (max-width:900px){.rgrid{grid-template-columns:1fr}}
.evs{list-style:none;margin:0;padding:0;max-height:none}
.ev{display:flex;gap:16px;padding:11px 0;border-top:1px solid var(--hair)}
.ev:first-child{border-top:0}
.ev-when{flex:0 0 58px;font-size:12px;color:var(--muted);padding-top:2px}
.ev-body{flex:1 1 auto;min-width:0}
.ev-tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  padding:2px 8px;border-radius:var(--r-pill);background:var(--panel-sunk);color:var(--ink-2)}
.ev-body p{margin:5px 0 0;font-size:13px;color:var(--ink-2);line-height:1.5}
.rcard{background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-panel);padding:16px 18px 10px}
.rcard-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.rcard-hd h3{margin:0;font-size:14.5px;font-weight:600}
.rcard-rate{font-size:19px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.rcard-sub{display:flex;justify-content:space-between;gap:12px;margin:3px 0 12px;
  font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.rsns{list-style:none;margin:0;padding:0;max-height:300px;overflow-y:auto}
.rsns--all{max-height:none;overflow:visible}
.rsn{padding:7px 0 9px;border-top:1px solid var(--hair)}
.rsn:first-child{border-top:0}
.rsn-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.rsn-lab{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsn-num{font-size:12px;color:var(--muted);white-space:nowrap}
.rsn-dot{opacity:.5}
.rsn-track{margin-top:6px;height:5px;border-radius:3px;background:var(--panel-sunk);overflow:hidden}
.rsn-track i{display:block;height:100%;border-radius:3px}
.pipe-bar{display:flex;height:30px;border-radius:7px;overflow:hidden;gap:2px;margin:6px 0 10px}
.pipe-bar i{display:block;height:100%;min-width:3px}
.pipe-leg{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 6px;font-size:12px;color:var(--ink-2)}
.pipe-leg span{display:inline-flex;align-items:center;gap:6px}
.pipe-leg .swatch{width:10px;height:10px;border-radius:3px;display:inline-block}
.pipe-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ptab{width:100%;min-width:560px;border-collapse:collapse;font-size:12.5px}
.pipe-card .rcard-hd{flex-wrap:wrap}
.rgrid.pipe-grid{grid-template-columns:minmax(0,1fr)}
.ptab th{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:right;padding:6px 8px;border-bottom:1px solid var(--hair-strong)}
.ptab th:first-child,.ptab td:first-child{text-align:left}
.ptab td{padding:7px 8px;border-bottom:1px solid var(--hair);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.ptab tr.sub td{color:var(--muted);font-size:12px;padding-top:4px;padding-bottom:4px}
.ptab tr.sub td:first-child{padding-left:26px}
.ptab tr.tot td{font-weight:600;color:var(--ink);border-top:1px solid var(--hair-strong);border-bottom:0}
.ptab .over{color:var(--down);font-weight:600}
.ptab .peak{font-weight:600;color:var(--ink)}
.pipe-mix{display:flex;flex-wrap:wrap;gap:6px 22px;margin:12px 0 4px;font-size:12px;color:var(--muted)}
.pipe-mix b{color:var(--ink-2);font-weight:600}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--hair-strong);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.foot a{color:var(--teal)}
@media (max-width:1080px){.grid2{grid-template-columns:1fr}
  .lanes{grid-template-columns:repeat(var(--lanes,3),minmax(250px,1fr));overflow-x:auto;padding-bottom:6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="mast">
  <div class="mast-in">
    <div>
      <h1>Delivery Metrics</h1>
      <p>Turnaround, SLA and fulfilment for image delivery — read at VIN, rooftop and region level.</p>
    </div>
    <div class="sync">
      <span class="who" id="who"></span>
      <span class="sync-txt" id="syncTxt"></span>
      <button class="btn" id="refreshBtn">Refresh data</button>
    </div>
  </div>
  <nav class="prods" id="prodTabs" role="tablist" aria-label="Product line"></nav>
</header>

<section class="gate" id="gate" hidden>
  <div class="gate-card">
    <h2>Delivery Metrics</h2>
    <p id="gateMsg">Sign in with your Spyne account to continue.</p>
    <div id="gsiBtn" class="gsi-slot"></div>
    <p class="gate-err" id="gateErr" hidden></p>
  </div>
</section>
<main class="wrap" id="main"></main>
<div class="tip" id="tip"></div>

<script>
"use strict";

/* ============================================================
   CONFIG — add sheets here as they land in the workbook.
   Set status:'live' on a product once its sheets exist.
   ============================================================ */
const SHEET_ID = "16vFElbOV8Awd63R6-WlsNdAScWNE18xGUPFkzE0GN7c";

/* ---- Sign-in ------------------------------------------------------------
   These are DEFAULTS. config.json, sitting next to this file in the repo,
   overrides every one of them at load:
     { "clientId": "....apps.googleusercontent.com",
       "allowedDomains": ["spyne.ai","spyne.co.in"],
       "admins": ["praveen@spyne.ai"],
       "contact": "praveen@spyne.ai" }
   Keeping them there means this file can be replaced wholesale without
   re-pasting anything. If config.json is missing, the values below are used.
   NOTE: this gates the UI. It is not a security boundary - the file is public
   and the sheets stay link-readable. Don't treat it as access control.        */
const STAGING          = false;
const CONFIG_FILE      = "config.json";
let   GOOGLE_CLIENT_ID = "";
let   ALLOWED_DOMAINS  = ["spyne.ai","spyne.co.in"];
let   ADMINS           = ["praveen@spyne.ai"];     // always admin, whatever access.json says
/* Per-person access lives in access.json, sitting next to this file in the repo,
   so adding someone is a small commit rather than an edit to this whole page:
     { "users": [ {"email":"praveen@spyne.ai","role":"admin"},
                  {"email":"someone@spyne.ai","role":"viewer"} ] }
   role is "admin" or "viewer" (anything else reads as viewer).
   If the file is missing, the dashboard falls back to letting any
   ALLOWED_DOMAINS address in — so nothing breaks before you create it.        */
const ACCESS_FILE      = "access.json";
/* One tab holds the programme list for every product; column A maps the row to
   a product tab. Add spellings here if the sheet starts using new ones. */
const PROGRAMS_SHEET   = "programs";
const PROGRAM_PRODUCTS = { images:["image","images"], spin:["360","360 spin","spin"], video:["video"] };
let   ACCESS_CONTACT   = "praveen@spyne.ai";       // where access requests are sent
/* Sign-in logging. A Google Form is the write endpoint - the page posts each
   sign-in to it and the responses land in a tab of the workbook, which the
   admin panel reads back. Set this block in config.json:
     "loginLog": {
       "formUrl": "https://docs.google.com/forms/d/e/FORM_ID/formResponse",
       "fields":  { "email": "entry.111111", "role": "entry.222222" },
       "sheetName": "Form Responses 1"
     }
   Leave it out and the logging simply doesn't run.                            */
let   LOGIN_LOG        = null;
/* 360 from the 360 Tracker dashboard's raw data (see the 360 product below). Set "raw360": false
   in config.json to put the 360 tab back on the Google Sheet tabs without touching this file. */

/* agg says how a metric combines across regions: "mean" for rates (the default),
   "sum" for totals, "ratio" for one total divided by another.
   needs lists the sheet columns required - a metric with a missing column is
   simply not offered, so cost appears on its own once the columns land.        */
/* tip names the count columns behind a rate for its hover tooltip: n is the
   population, bad the part that missed. A sheet without them shows the value only. */
function mkMetrics(lastId,lastLabel,costLabel,slaHrs,combo){
  const h=slaHrs||6;
  /* SLA counts delivered units only, the same ones as TAT, so both tooltips share one total. */
  const slaTip={ n:"sla_checked", bad:"sla_breached", nLabel:"Delivered", goodLabel:"Within SLA", badLabel:"SLA breach" };
  const tatTip={ n:"tat_measured", bad:"tat_over_sla", nLabel:"Measured", goodLabel:"Within "+h+"h", badLabel:"Over "+h+"h" };
  /* Fulfilment leads: it covers every unit received; SLA and TAT then describe the delivered ones. */
  return [
    { id:lastId,        label:lastLabel,   kind:"pct", better:"high", combo:combo||null },
    { id:"sla_pct",     label:"SLA < "+h+" hrs", kind:"pct", better:"high", tip:slaTip },
    { id:"p99_tat_hrs", label:"TAT (P99)", kind:"hrs", better:"low", tip:tatTip },
    { id:"p95_tat_hrs", label:"TAT (P95)", kind:"hrs", better:"low", tip:tatTip },
    /* Cost per unit only. Total cost and volume are still queried - the ratio
       needs both - but neither is offered as a card or chart of its own. */
    { id:"cost_per_image", label:costLabel||"Cost / image", kind:"inr2", better:"low", agg:"ratio", src:"bq" }
  ];
}

/* Each product names its own metrics — images reports fulfilment, 360 reports delivery. */
function hasCol(name){
  const ls=lanesOf();
  for(let i=0;i<ls.length;i++){
    const rows=raw(ls[i].id);
    for(let j=0;j<rows.length;j++) if(rows[j].v[name]!=null) return true;
  }
  return false;
}
function metricsOf(){
  const base=(PRODUCTS.find(p=>p.id===state.product)||{}).metrics || METRICS;
  return base.filter(m=> m.src==="bq" ? !!state.cost : (!m.needs || m.needs.every(hasCol)) );
}
function metricById(id){ const l=metricsOf(); return l.find(m=>m.id===id) || l[0]; }
/* The same measure has a different column name per product (fulfillment_pct vs
   delivery_pct), so match on the label to keep the selection when tabs change. */
function labelOfMetricId(id){
  for(let i=0;i<PRODUCTS.length;i++){
    const ms=PRODUCTS[i].metrics;
    if(!ms) continue;
    const m=ms.find(x=>x.id===id);
    if(m) return m.label;
  }
  return null;
}
function remapMetric(id){
  const ms=metricsOf();
  if(ms.some(m=>m.id===id)) return id;
  const lab=labelOfMetricId(id);
  const hit=lab ? ms.find(m=>m.label===lab) : null;
  return hit ? hit.id : ms[0].id;
}

function rawFilters(){

/* Recompute the three lanes from the raw rows with the current filters. */
function computeRaw(){
  const rows=state.rawRows[state.product];
  if(!rows) return;
  const out=Engine360.compute(rows, rawFilters());
  state.data[key("spin")]=out.spin; state.data[key("rt")]=out.rt; state.data[key("region")]=out.region;
}
async function loadRaw(prod){
  const tok=(function(){ try{ return sessionStorage.getItem("dm_cred"); }catch(e){ return null; } })();
  const opts={ headers:{ "X-Google-Id-Token": tok||"" }, cache:"no-store" };
  const get=async function(path){
    const r=await fetch(prod.raw.base+"/data/"+path+"?_="+Date.now(), opts);
    if(r.status===403) throw new Error("NO_ACCESS");
    if(r.status===401) throw new Error("SIGN_IN");
    if(!r.ok) throw new Error("HTTP "+r.status+" reading "+path);
    return r.json();
  };
  const idx=await get("index.json");
  const months=(idx.months||[]).map(m=>typeof m==="string"?m:(m.key||m.month||m.id)).filter(Boolean);
  const parts=await Promise.all(months.map(m=>get(m+".json")));
  const rows=[]; parts.forEach(p=>{ if(p&&p.rows) rows.push.apply(rows,p.rows); });
  Engine360.prepare(rows);
  state.rawRows[prod.id]=rows;
  if(!state.rawTypes[prod.id]) state.rawTypes[prod.id]=new Set(Engine360.values(rows,'type'));
  if(!state.rawSources[prod.id]) state.rawSources[prod.id]=new Set(Engine360.values(rows,'source'));
  state.rawSynced=idx.lastSynced?new Date(idx.lastSynced):null;
}
function isAdmin(){ return !!(state.user && state.user.admin); }

function vfOn(){ return !!(curProduct().vfToggle && state.includeVF); }
function key(laneId){ return state.product+(vfOn()?":vf":"")+":"+laneId; }
function laneSheet(l){ return vfOn() ? l.sheet+"_vf" : l.sheet; }
function raw(laneId){ return state.data[key(laneId)] || []; }
function regSet(){

  return state.regions[state.product];
}

/* ---------- sign-in ---------- */
/* Fire-and-forget: a Google Form accepts a cross-origin POST but answers
   opaquely, so we can't confirm it landed. Never block sign-in on it. */
function logSignIn(user){
  if(STAGING) return;   /* test sign-ins stay out of the login log */
  if(!LOGIN_LOG || !LOGIN_LOG.formUrl || !LOGIN_LOG.fields) return;
  try{
    const body=new URLSearchParams();
    if(LOGIN_LOG.fields.email) body.append(LOGIN_LOG.fields.email, user.email);
    if(LOGIN_LOG.fields.role)  body.append(LOGIN_LOG.fields.role, user.admin?"admin":"viewer");
    /* credentials:"include" sends the browser's Google session with the POST,
       so the form can stay restricted to Spyne accounts instead of being open
       to anyone with the link. Harmless if the form is public. */
    fetch(LOGIN_LOG.formUrl,{method:"POST",mode:"no-cors",credentials:"include",body:body})
      .catch(function(){});
  }catch(e){ /* logging must never break sign-in */ }
}
/* Anything config.json sets wins over the defaults above. A missing or broken
   file is not fatal - we just keep the defaults. */
async function loadConfig(){
  try{
    const r=await fetch(CONFIG_FILE+"?_="+Date.now(),{cache:"no-store"});
    if(!r.ok) return;
    const c=await r.json();
    if(c && typeof c.clientId==="string" && c.clientId.trim()) GOOGLE_CLIENT_ID=c.clientId.trim();
    if(c && Array.isArray(c.allowedDomains) && c.allowedDomains.length)
      ALLOWED_DOMAINS=c.allowedDomains.map(d=>String(d).trim().toLowerCase()).filter(Boolean);
    if(c && Array.isArray(c.admins) && c.admins.length)
      ADMINS=c.admins.map(e=>String(e).trim().toLowerCase()).filter(Boolean);
    if(c && typeof c.contact==="string" && c.contact.trim()) ACCESS_CONTACT=c.contact.trim();
    if(c && c.loginLog && c.loginLog.formUrl && c.loginLog.fields) LOGIN_LOG=c.loginLog;
    if(c && c.cost && c.cost.project && c.cost.dataset) COST=c.cost;
    if(c && c.raw360===false) RAW360=false;
  }catch(e){ /* keep defaults */ }
}
function decodeJwt(tok){
  const p=tok.split(".")[1];
  const j=atob(p.replace(/-/g,"+").replace(/_/g,"/"));
  return JSON.parse(decodeURIComponent(Array.prototype.map.call(j,
    c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join("")));
}
function gateError(msg){
  const el=document.getElementById("gateErr");
  el.textContent=msg; el.hidden=!msg;
}
function acceptCredential(resp){
  let p;
  try{ p=decodeJwt(resp.credential); }
  catch(e){ return gateError("That sign-in couldn\u2019t be read. Try again."); }
  if(p.aud!==GOOGLE_CLIENT_ID)        return gateError("This sign-in was issued for a different app.");
  if(!p.exp || p.exp*1000<Date.now()) return gateError("That sign-in has expired. Try again.");
  const email=String(p.email||"").toLowerCase();
  const domain=email.split("@")[1]||"";
  if(ALLOWED_DOMAINS.indexOf(domain)<0)
    return gateError(email+" isn\u2019t a Spyne account. Sign in with your work address.");
  state.user={ email:email, name:p.name||email, admin:ADMINS.indexOf(email)>=0, exp:p.exp };
  try{ sessionStorage.setItem("dm_cred",resp.credential); }catch(e){}
  gateError("");
  showApp(true);
}
function restoreSession(){
  let tok=null;
  try{ tok=sessionStorage.getItem("dm_cred"); }catch(e){}
  if(!tok) return false;
  try{
    const p=decodeJwt(tok);
    if(p.aud!==GOOGLE_CLIENT_ID || !p.exp || p.exp*1000<Date.now()) return false;
    const email=String(p.email||"").toLowerCase();
    if(ALLOWED_DOMAINS.indexOf(email.split("@")[1]||"")<0) return false;
    state.user={ email:email, name:p.name||email, admin:ADMINS.indexOf(email)>=0, exp:p.exp };
    return true;
  }catch(e){ return false; }
}
function signOut(){
  try{ sessionStorage.removeItem("dm_cred"); }catch(e){}
  try{ if(window.google&&google.accounts&&google.accounts.id) google.accounts.id.disableAutoSelect(); }catch(e){}
  state.user=null; state.data={}; state.synced=null; state.access=null; state.denied=false;
  showGate();
}
function showGate(){
  document.getElementById("gate").hidden=false;
  document.getElementById("main").innerHTML="";
  renderTabs(); renderSync();
  if(!GOOGLE_CLIENT_ID){
    document.getElementById("gateMsg").textContent=
      "Sign-in isn\u2019t configured yet \u2014 add your Google OAuth Client ID to "+CONFIG_FILE+" in the repo.";
    return;
  }
  waitForGsi();
}
function waitForGsi(tries){
  tries=tries||0;
  if(window.google && google.accounts && google.accounts.id){
    google.accounts.id.initialize({ client_id:GOOGLE_CLIENT_ID, callback:acceptCredential, auto_select:true });
    const slot=document.getElementById("gsiBtn");
    slot.innerHTML="";
    google.accounts.id.renderButton(slot,{theme:"outline",size:"large",text:"signin_with",shape:"pill",width:260});
    google.accounts.id.prompt();
    return;
  }
  if(tries>40) return gateError("Couldn\u2019t reach Google sign-in. Check the connection and reload.");
  setTimeout(()=>waitForGsi(tries+1),150);
}
/* Reads access.json from the repo. Returns null when there isn't one, which
   means "fall back to domain-only" rather than "nobody gets in". */
async function loadAccess(){
  try{
    const res=await fetch(ACCESS_FILE+"?_="+Date.now(),{cache:"no-store"});
    if(!res.ok) return null;
    const j=await res.json();
    const list=Array.isArray(j) ? j : (j&&Array.isArray(j.users) ? j.users : null);
    if(!list) return null;
    const out=[];
    list.forEach(u=>{
      const email=String((u&&(u.email||u))||"").trim().toLowerCase();
      if(!email || email.indexOf("@")<0) return;
      const role=String((u&&u.role)||"viewer").trim().toLowerCase();
      out.push({ email:email, role:role });
    });
    return out.length ? out : null;
  }catch(e){ return null; }
}
function showDenied(){
  state.denied=true;
  renderTabs(); renderSync();
  const mail="mailto:"+ACCESS_CONTACT+
    "?subject="+encodeURIComponent("Delivery Metrics \u2014 access request")+
    "&body="+encodeURIComponent("Hi Praveen,\n\nPlease give me access to the Delivery Metrics dashboard.\n\nAccount: "+
      state.user.email+"\nWhat I need it for: \n\nThanks");
  document.getElementById("main").innerHTML=
    '<div class="state" style="margin-top:48px"><h3>You\u2019re not on the access list yet</h3>'+
    '<p>'+esc(state.user.email)+' signed in fine, but hasn\u2019t been given access to this dashboard. '+
    'Send a request and it\u2019ll land in '+esc(ACCESS_CONTACT)+'\u2019s inbox.</p>'+
    '<p style="margin-top:18px"><a class="btn" style="background:var(--teal);border-color:var(--teal);color:#fff;'+
      'text-decoration:none;display:inline-block" href="'+mail+'">Request access</a>'+
    '<button class="linky" id="denySignOut" style="margin-left:18px">Sign in as someone else</button></p></div>';
  const so=document.getElementById("denySignOut");
  if(so) so.onclick=signOut;
}
async function showApp(fresh){
  document.getElementById("gate").hidden=true;
  state.denied=false;
  state.access=await loadAccess();
  const forcedAdmin=ADMINS.indexOf(state.user.email)>=0;
  if(state.access){
    const hit=state.access.find(a=>a.email===state.user.email);
    if(!hit && !forcedAdmin) return showDenied();
    state.user.admin = forcedAdmin || (hit && hit.role==="admin");
  }
  if(fresh) logSignIn(state.user);   // only on a real sign-in, not a session restore
  render();
  loadAll();
}

/* ---------- data ---------- */
function gvizBase(sheet){
  return "https://docs.google.com/spreadsheets/d/"+SHEET_ID+
         "/gviz/tq?headers=1&sheet="+encodeURIComponent(sheet)+"&_="+Date.now();
}
/* Opened straight off disk, the page has a null origin and Google refuses the
   cross-origin fetch. A <script> tag has no such limit, so fall back to JSONP. */
let jsonpN=0;
function loadViaJsonp(sheet){
  return new Promise(function(resolve,reject){
    const cb="__gviz_cb_"+(++jsonpN);
    const s=document.createElement("script");
    let settled=false;
    function cleanup(){ try{ delete window[cb]; }catch(e){ window[cb]=undefined; } if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb]=function(resp){
      settled=true; cleanup();
      if(!resp||resp.status==="error"){
        reject(new Error((resp&&resp.errors&&resp.errors[0]&&resp.errors[0].detailed_message)||("Sheet \u201c"+sheet+"\u201d could not be read")));
      } else resolve(resp.table);
    };
    s.onerror=function(){ if(!settled){ cleanup(); reject(new Error("Couldn\u2019t reach Google Sheets \u2014 check the connection")); } };
    s.src=gvizBase(sheet)+"&tqx=out:json;responseHandler:"+cb;
    document.head.appendChild(s);
    setTimeout(function(){ if(!settled){ cleanup(); reject(new Error("Sheet \u201c"+sheet+"\u201d timed out")); } },25000);
  });
}
async function fetchTable(sheet){
  try{
    const res=await fetch(gvizBase(sheet)+"&tqx=out:json");
    if(!res.ok) throw new Error("HTTP "+res.status);
    return parseGviz(await res.text());
  }catch(e){
    return loadViaJsonp(sheet);
  }
}
function parseGviz(text){
  const s=text.indexOf("{"), e=text.lastIndexOf("}");
  if(s<0) throw new Error("Unexpected response from Google Sheets");
  const j=JSON.parse(text.slice(s,e+1));
  if(j.status==="error") throw new Error((j.errors&&j.errors[0]&&j.errors[0].detailed_message)||"Sheet query failed");
  return j.table;
}
/* Products whose lane sheets carry day rows. 360 has none yet. */
const DAILY_PRODUCTS = ["images","video"];
function hasDaily(){ return DAILY_PRODUCTS.indexOf(state.product)>=0 || isRaw(); }   /* raw 360 has days too */
function normGran(v){
  const g=String(v==null?"":v).trim().toLowerCase();
  if(/^da(y|ily)/.test(g)) return "day";   /* "day" and "daily" */
  if(g.indexOf("week")===0) return "week";
  if(g.indexOf("month")===0) return "month";
  return g;
}
/* Order periods off their labels (M-4 \u2192 MTD) so sheets without a date column
   still read oldest-to-newest instead of however the rows happen to sit. */
function periodRank(p){
  const t=String(p==null?"":p).trim();
  const m=/^([MWDQY])-(\d+)$/i.exec(t);
  if(m) return -parseInt(m[2],10);
  if(/^(MTD|WTD|DTD|QTD|YTD)$/i.test(t)) return 0;
  return null;
}
function comparePeriods(a,b){
  const ra=periodRank(a.period), rb=periodRank(b.period);
  if(ra!==null && rb!==null && ra!==rb) return ra-rb;
  if(a.date && b.date) return a.date-b.date;
  return 0;
}
function toDate(v){
  if(v==null) return null;
  if(v instanceof Date) return v;
  const m=/^Date\((\d+),(\d+),(\d+)/.exec(String(v));
  return m ? new Date(+m[1],+m[2],+m[3]) : new Date(v);
}
async function loadSheet(sheet){
  const table=await fetchTable(sheet);
  const labels=table.cols.map((c,i)=>(c.label||c.id||("col"+i)).trim());
  return table.rows.map(r=>{
    const o={ v:{} };
    labels.forEach((lab,i)=>{
      const cell=r.c&&r.c[i], val=cell?cell.v:null;
      if(lab==="sort_date") o.date=toDate(val);
      /* Sheets don't all use the same headers: images/360 say granularity + sort_group,
         video says period_type + sort_order, and two video sheets carry no date at all. */
      else if(lab==="granularity"||lab==="period_type") o.granularity=normGran(val);
      /* images sheets label days "Day-1"; video and the cost query say "D-1". */
      else if(lab==="period") o.period=val==null?"":String(val).trim().replace(/^Day-(\d+)$/i,"D-$1");
      else if(lab==="region") o.region=val==null?"Unknown":String(val);
      else if(lab==="region_set") o.regionSet=val==null?"":String(val);
      else if(lab==="sort_group"||lab==="sort_order") o.group=val;
      else o.v[lab]= (val===""||val==null) ? null : Number(val);
    });
    return o;
  }).filter(r=>r.period);
}
async function loadAll(){
  const prod=PRODUCTS.find(p=>p.id===state.product);
  if(!prod||prod.status!=="live"||!prod.lanes.length) return;
  state.loading=true; state.error=null; render();
  try{
    if(rawOn(prod)){
      await loadRaw(prod);
      computeRaw();
    } else {
      const results=await Promise.all(prod.lanes.map(l=>loadSheet(laneSheet(l))));
      prod.lanes.forEach((l,i)=>{ state.data[key(l.id)]=results[i]; });
    }
    if(!state.regionsInit[state.product]){
      allRegions().forEach(r=>regSet().add(r));
      state.regionsInit[state.product]=true;
      if(rawOn(prod)) computeRaw();
    }
    await ensureByRegion();
    state.extras[prod.id]=await loadExtra(prod);
    if(prod.pipeline) state.pipes[prod.id]=await loadPipe(prod.pipeline.sheet).catch(()=>null);
    state.programs=await loadPrograms();
    state.qualities[prod.id]=await loadQuality(prod);
    state.costError=null;
    state.cost=await loadCost();
    state.costLatest=null;
    if(state.cost) state.cost.forEach(function(r){
      if(r.latest && (!state.costLatest || r.latest>state.costLatest)) state.costLatest=r.latest;
    });
    state.synced=(rawOn(prod) && state.rawSynced) ? state.rawSynced : new Date();
    if(isAdmin() && LOGIN_LOG && LOGIN_LOG.sheetName){
      try{ state.loginLog=await loadLoginLog(); }catch(e){ state.loginLog=null; }
    }
  }catch(err){
    const m=err.message||String(err);
    state.error = m==="NO_ACCESS" ? "Your account isn\u2019t on the 360 Tracker dashboard\u2019s access list, so its 360 data can\u2019t be shown here. Ask the 360 dashboard owner to add you."
                : m==="SIGN_IN"   ? "Your sign-in has expired for the 360 data. Sign out and sign in again."
                : m;
  }
  state.loading=false; render();
}

/* Reads the form's response tab back. Columns are matched by header text so it
   survives Google's default "Timestamp" naming or anything you rename them to. */
async function loadLoginLog(){
  const t=await fetchTable(LOGIN_LOG.sheetName);
  const labels=t.cols.map(c=>String(c.label||"").trim().toLowerCase());
  const find=frag=>labels.findIndex(l=>l.indexOf(frag)>=0);
  const ti=find("time")>=0?find("time"):0, ei=find("mail"), ri=find("role");
  const cell=(r,i)=> (i>=0 && r.c && r.c[i] && r.c[i].v!=null) ? r.c[i].v : null;
  const out=[];
  t.rows.forEach(r=>{
    const em=cell(r,ei);
    if(!em) return;
    out.push({ at:toDate(cell(r,ti)), email:String(em).trim().toLowerCase(),
               role:ri>=0 ? String(cell(r,ri)||"").trim() : "" });
  });
  out.sort((a,b)=> (a.at&&b.at) ? b.at-a.at : 0);
  return out;
}

/* ---------- cost, straight from BigQuery ----------
   Same cost model as the QC Cost dashboard: a person's monthly salary (prorated
   for a partial month, carried forward when payroll is late) spread over that
   month's Sum_Target, giving a rate per unit of target. Work rows are priced at
   that rate, so a 360 spin costs more than a still. Region and segment come
   from arr, joined on Team_ID.
   Queries run as the signed-in user, so this needs BigQuery access on the
   project. Without it, cost simply doesn't appear rather than erroring.        */
let COST = null;               // config.json -> "cost": {...}
const BQ = { token:null, client:null, pending:null, tried:false };

function bqReady(){
  return new Promise(function(resolve,reject){
    const t0=Date.now();
    (function poll(){
      if(window.google && google.accounts && google.accounts.oauth2) return resolve();
      if(Date.now()-t0>12000) return reject(new Error("Google sign-in didn't load."));
      setTimeout(poll,120);
    })();
  });
}
function bqInitClient(){
  if(BQ.client) return;
  BQ.client=google.accounts.oauth2.initTokenClient({
    client_id:GOOGLE_CLIENT_ID,
    scope:"https://www.googleapis.com/auth/bigquery.readonly",
    callback:function(r){
      const p=BQ.pending; BQ.pending=null;
      if(!p) return;
      r && r.access_token ? p.resolve(r.access_token) : p.reject(new Error("No token"));
    },
    error_callback:function(){ const p=BQ.pending; BQ.pending=null; if(p) p.reject(new Error("cancelled")); }
  });
}
/* prompt:"" asks for a token without showing anything. It works when the person
   has already consented; the first time round it needs the visible prompt. */
function bqToken(interactive){
  return bqReady().then(function(){
    bqInitClient();
    return new Promise(function(resolve,reject){
      BQ.pending={resolve:resolve,reject:reject};
      try{ BQ.client.requestAccessToken({prompt:interactive?"consent":"", hint:state.user?state.user.email:undefined}); }
      catch(e){ BQ.pending=null; reject(e); }
    });
  });
}
async function bq(sql){
  const base="https://bigquery.googleapis.com/bigquery/v2/projects/"+COST.project;
  const auth={ Authorization:"Bearer "+BQ.token, "Content-Type":"application/json" };
  const res=await fetch(base+"/queries",{method:"POST",headers:auth,
    body:JSON.stringify({query:sql,useLegacySql:false,timeoutMs:180000,maxResults:20000})});
  const data=await res.json();
  if(res.status===401){ const e=new Error("expired"); e.expired=true; throw e; }
  if(!res.ok) throw new Error((data.error&&data.error.message)||("BigQuery returned "+res.status));
  if(!data.jobComplete) throw new Error("Query still running \u2014 press Refresh in a moment.");
  const cols=((data.schema&&data.schema.fields)||[]).map(f=>f.name);
  const shape=page=>((page.rows)||[]).map(r=>{ const o={}; cols.forEach((c,i)=>o[c]=r.f[i].v); return o; });
  let rows=shape(data), token=data.pageToken;
  const job=data.jobReference||{};
  while(token && rows.length<500000){
    const qs=new URLSearchParams({pageToken:token,maxResults:"20000"});
    if(job.location) qs.set("location",job.location);
    const r2=await fetch(base+"/queries/"+job.jobId+"?"+qs,{headers:auth});
    const d2=await r2.json();
    if(!r2.ok) throw new Error((d2.error&&d2.error.message)||"Couldn't page the results.");
    rows=rows.concat(shape(d2)); token=d2.pageToken;
  }
  return rows;
}

function costSql(){
  const P=COST.project, D=COST.dataset;
  const domains=(COST.deliveryDomains||["spyne.co.in"])
    .map(d=>"LOWER(TRIM(QC)) LIKE '%@"+d+"'").join(" OR ");
  const assumed=COST.assumedMonthlySalary==null?25000:COST.assumedMonthlySalary;
  const months=COST.months||8;
  /* weekOffset shifts which real week gets called W-1. 0 means W-1 is the last
     complete week; set it to 1 if your sheets call the week in progress W-1. */
  const wOff=COST.weekOffset==null?0:COST.weekOffset;
  return `
WITH work AS (
  SELECT LOWER(TRIM(QC)) AS qc_email,
         DATE(Hourly_Date) AS work_date,
         FORMAT_DATE('%Y-%m', DATE(Hourly_Date)) AS month_key,
         LOWER(TRIM(Team_id)) AS team_id,
         TRIM(Product) AS product,
         IFNULL(Images,0) AS images,
         IFNULL(Sum_Target,0) AS sum_target
  FROM \`${P}.${D}.delivery_working_data\`
  WHERE QC IS NOT NULL AND TRIM(QC) != ''
    AND DATE(Hourly_Date) >= DATE_TRUNC(DATE_SUB(CURRENT_DATE(), INTERVAL ${months} MONTH), MONTH)
    AND (${domains})
),
salary_raw AS (
  SELECT FORMAT_DATE('%Y-%m', SAFE.PARSE_DATE("%b'%y", Month)) AS month_key,
         LOWER(TRIM(\`Work Email\`)) AS email, Salary AS salary
  FROM \`${P}.${D}.salary_sheet\`
  WHERE \`Work Email\` IS NOT NULL AND Salary IS NOT NULL
    AND SAFE.PARSE_DATE("%b'%y", Month) IS NOT NULL
),
sal_email AS (
  SELECT month_key, email, SUM(salary) AS salary FROM salary_raw GROUP BY month_key, email
),
month_has_salary AS ( SELECT DISTINCT month_key FROM sal_email ),
pm_volume AS (
  SELECT qc_email, month_key, SUM(images) AS month_images, SUM(sum_target) AS month_target
  FROM work GROUP BY qc_email, month_key
),
month_span AS (
  SELECT month_key,
         DATE_DIFF(MAX(work_date), DATE_TRUNC(MAX(work_date), MONTH), DAY) + 1 AS days_covered,
         EXTRACT(DAY FROM LAST_DAY(MAX(work_date))) AS days_in_month
  FROM work GROUP BY month_key
),
pm_joined AS (
  SELECT v.qc_email, v.month_key, v.month_images, v.month_target, s.salary AS actual_salary
  FROM pm_volume v LEFT JOIN sal_email s
    ON s.month_key = v.month_key AND s.email = v.qc_email
),
pm_filled AS (
  SELECT *, LAST_VALUE(actual_salary IGNORE NULLS) OVER w AS carried_salary
  FROM pm_joined
  WINDOW w AS (PARTITION BY qc_email ORDER BY month_key ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
),
pm AS (
  SELECT f.qc_email, f.month_key,
    SAFE_DIVIDE(
      COALESCE(f.actual_salary, IF(mh.month_key IS NULL, COALESCE(f.carried_salary, ${assumed}), NULL))
        * LEAST(1.0, SAFE_DIVIDE(ms.days_covered, ms.days_in_month)),
      NULLIF(f.month_target, 0)) AS rate
  FROM pm_filled f
  JOIN month_span ms USING (month_key)
  LEFT JOIN month_has_salary mh USING (month_key)
),
dims AS (
  SELECT LOWER(TRIM(Team_ID)) AS team_id,
         ANY_VALUE(Region) AS region,
         ANY_VALUE(Enterprise_Details___Enterprise___Customer_Segment) AS segment
  FROM \`${P}.${D}.arr\`
  WHERE Team_ID IS NOT NULL AND TRIM(Team_ID) != ''
  GROUP BY team_id
),
priced AS (
  SELECT w.work_date, w.product, w.images,
         w.sum_target * IFNULL(pm.rate, 0) AS cost,
         IF(pm.rate IS NULL, w.images, 0)  AS unpriced_images,
         IFNULL(d.region,  'Unknown') AS region,
         IFNULL(d.segment, 'Unknown') AS segment
  FROM work w
  JOIN pm ON pm.qc_email = w.qc_email AND pm.month_key = w.month_key
  LEFT JOIN dims d ON d.team_id = w.team_id
),
bucketed AS (
  SELECT 'month' AS period_type,
         DATE_DIFF(DATE_TRUNC(CURRENT_DATE(),MONTH), DATE_TRUNC(work_date,MONTH), MONTH) AS idx,
         work_date, product, region, segment, images, cost, unpriced_images
  FROM priced
  UNION ALL
  SELECT 'week',
         DATE_DIFF(DATE_TRUNC(CURRENT_DATE(),WEEK(MONDAY)), DATE_TRUNC(work_date,WEEK(MONDAY)), WEEK) + ${wOff},
         work_date, product, region, segment, images, cost, unpriced_images
  FROM priced
  UNION ALL
  SELECT 'day',
         DATE_DIFF(CURRENT_DATE(), work_date, DAY),
         work_date, product, region, segment, images, cost, unpriced_images
  FROM priced
)
SELECT period_type,
       CASE WHEN period_type='month' AND idx=0 THEN 'MTD'
            WHEN period_type='month' THEN FORMAT('M-%d', idx)
            WHEN period_type='day' THEN FORMAT('D-%d', idx)
            ELSE FORMAT('W-%d', idx) END AS period,
       product, region, segment,
       ROUND(SUM(cost),2) AS cost,
       SUM(images) AS images,
       SUM(unpriced_images) AS unpriced_images,
       MAX(work_date) AS latest
FROM bucketed
WHERE (period_type='month' AND idx BETWEEN 0 AND 5)
   OR (period_type='week'  AND idx BETWEEN 1 AND 4)
   OR (period_type='day'   AND idx BETWEEN 1 AND 7)
GROUP BY period_type, period, product, region, segment`;
}

/* map sheet-side names onto what BigQuery returns */
function normKey(x){ return String(x==null?"":x).toLowerCase().replace(/[^a-z0-9]/g,""); }
function costProductMatch(product){
  const map=(COST&&COST.productMap)||{ images:["images","image"], spin:["360","spin","360 spin"], video:["video"] };
  const want=map[state.product]||[];
  const p=normKey(product);
  return want.some(w=>normKey(w)===p);
}
function costSegmentOf(segment){
  const map=(COST&&COST.segmentMap)||{ ent:["enterprise"], mid:["mid-market","mid market","midmarket","mid"],
                                       resellers:["reseller","resellers"], smb:["smb"] };
  const s=normKey(segment);
  if(!s) return null;
  for(const k in map) if(map[k].some(v=>normKey(v)===s)) return k;
  /* Fall back to containment so "Enterprise - Tier 1" or "SMB (new)" still land. */
  for(const k in map) if(map[k].some(function(v){ const nv=normKey(v);
    return nv && (s.indexOf(nv)===0 || nv.indexOf(s)===0 || s.indexOf(nv)>=0); })) return k;
  return null;
}
async function loadCost(){
  if(!COST || COST.enabled===false || !GOOGLE_CLIENT_ID) return null;
  if(!BQ.token){
    try{ BQ.token=await bqToken(false); }
    catch(e){ return null; }          // no consent yet - offer the button instead
  }
  try{ return await bq(costSql()); }
  catch(e){
    if(e.expired){
      try{ BQ.token=await bqToken(false); return await bq(costSql()); }catch(e2){ return null; }
    }
    state.costError=e.message||String(e);
    try{ console.error("cost query failed:", state.costError); }catch(_){}
    return null;
  }
}

/* aggregate the BQ rows down to the periods on screen */
function costSeries(laneId, metric, prefix, regionsOverride){
  const rows=state.cost;
  if(!rows) return periodsOf().map(()=>null);
  const px = prefix!=null ? prefix : segPrefix();
  const segWanted = px==="" ? null : px.replace(/_$/,"");
  const keep = laneId==="region" ? (regionsOverride||activeRegions()) : null;
  const acc={};
  rows.forEach(r=>{
    if(r.period_type!==state.granularity) return;
    if(!costProductMatch(r.product)) return;
    if(segWanted && costSegmentOf(r.segment)!==segWanted) return;
    if(keep && keep.indexOf(r.region)<0) return;
    const a=acc[r.period]||(acc[r.period]={cost:0,images:0});
    a.cost   += Number(r.cost)||0;
    a.images += Number(r.images)||0;
  });
  return periodsOf().map(p=>{
    const a=acc[p];
    if(!a) return null;
    if(metric.id==="cost")   return a.cost;
    if(metric.id==="images") return a.images;
    return a.images ? a.cost/a.images : null;     // cost per image
  });
}

/* Fixed panels that ignore every filter. Rows come either from the config or
   from a workbook tab shaped reason | count | %. */
function panelsOf(prod){
  const list=(prod&&prod.panels)?prod.panels.slice():[];
  if(prod&&prod.incidents) list.push(Object.assign({kind:"log"}, prod.incidents));
  return list;
}
async function loadExtra(prod){
  const all=panelsOf(prod);
  if(!all.length) return null;
  const out={};
  const seen={};
  const unique=all.filter(function(p){
    if((p.raw && rawOn(prod)) || !p.sheet || seen[p.sheet]) return false;
    seen[p.sheet]=true; return true;
  });
  await Promise.all(unique.map(async function(p){
    try{
      const t=await fetchTable(p.sheet);
      const labels=t.cols.map(c=>String(c.label||"").trim());
      if(p.kind==="table"){
        out[p.sheet]={ cols:labels, types:t.cols.map(c=>c.type),
          rows:t.rows.map(r=>labels.map((l,i)=>(r.c&&r.c[i]&&r.c[i].v!=null)?r.c[i].v:null))
                     .filter(r=>r.some(v=>v!=null&&v!=="")) };
        return;
      }
      if(p.kind==="log"){
        const di=t.cols.findIndex(c=>c.type==="date"||c.type==="datetime");
        const strs=t.cols.map((c,i)=>i).filter(i=>i!==di && labels[i]!=="");
        out[p.sheet]=t.rows.map(function(r){
          const g=i=> (i>=0&&r.c&&r.c[i]&&r.c[i].v!=null) ? r.c[i].v : null;
          return { at:toDate(g(di)), by:String(g(strs[0])||""), text:String(g(strs[1])||g(strs[0])||"") };
        }).filter(x=>x.text).sort((a,b)=>(a.at&&b.at)?b.at-a.at:0);
        return;
      }
      const low=labels.map(l=>l.toLowerCase());
      const num=i=>t.rows.some(r=>r.c&&r.c[i]&&typeof r.c[i].v==="number");
      const byName=re=>low.findIndex(l=>re.test(l));
      const pti=byName(/^period_type$|^granularity$/);
      const pei=byName(/^period$/);
      const cti=byName(/^category$|^type$|^group$/);
      let li=byName(/reason|issue|label|bucket/);
      if(li<0) li=labels.findIndex((l,i)=>!num(i) && i!==pti && i!==pei && i!==cti);
      const pi=labels.findIndex((l,i)=>num(i)&&/^%$|pct|percent|share|rate/i.test(l));
      const ci=labels.findIndex((l,i)=>num(i)&&i!==pi);
      out[p.sheet]=t.rows.map(function(r){
        const g=i=> (i>=0&&r.c&&r.c[i]&&r.c[i].v!=null) ? r.c[i].v : null;
        let pct=g(pi);
        /* pctWhole means the sheet already stores 1.58 for 1.58%. Guessing from
           magnitude breaks below 1, where 0.28 would read as 28%. */
        if(pct!=null) pct = p.pctWhole ? pct/100 : (pct>1 ? pct/100 : pct);
        let lab=g(li)==null?"":String(g(li)).trim();
        if(!lab || lab.toLowerCase()==="null") lab="Unspecified";
        return { pt:normGran(g(pti)), p:g(pei)==null?null:String(g(pei)).trim(),
                 cat:g(cti)==null?null:String(g(cti)).trim(),
                 label:lab, count:Number(g(ci))||0, pct:pct };
      }).filter(x=>x.label);
    }catch(e){ out[p.sheet]=null; }
  }));
  return out;
}
function extraHTML(){
  const prod=PRODUCTS.find(p=>p.id===state.product);
  if(!prod || !prod.panels || !prod.panels.length) return "";
  const pct=v=>(v==null?"\u2014":(v*100).toFixed(2)+"%");
  const periodsNow=periodsOf();
  let latestPeriod=periodsNow.length?periodsNow[periodsNow.length-1]:null;
  /* Raw 360: the reasons show one period at a time, picked in the section header (as on the
     360 dashboard's Reports tab); the latest one until another is picked. */
  if(rawOn(prod) && periodsNow.indexOf(state.issuesPeriod[prod.id])>=0) latestPeriod=state.issuesPeriod[prod.id];
  let filtered=false;
  const rawIss = (rawOn(prod) && latestPeriod && state.rawRows[prod.id])
    ? Engine360.issues(state.rawRows[prod.id], rawFilters(), latestPeriod, state.granularity, state.segment) : null;
  const cards=prod.panels.map(function(p){
    let rows = p.rows || (state.extras[state.product] && state.extras[state.product][p.sheet]) || null;
    let rawHead=null;
    if(p.raw && rawOn(prod)){
      if(!rawIss) return "";
      /* Every not-delivered spin is in exactly one card; shares are of every spin (the Fulfilment
         base), so the four cards add up to 100 \u2212 Fulfilment. QC lists issues (a spin can have
         more than one blocker) but its header counts spins. */
      const map = p.cat==="QC Failed" ? rawIss.qcReasons : p.cat==="Validation Failed" ? rawIss.valReasons
                : p.cat==="Not delivered yet" ? rawIss.notYet : rawIss.techReasons;
      const base = rawIss.total || 0;
      const n = p.cat==="QC Failed" ? rawIss.qcSkus : Object.values(map).reduce((a,b)=>a+b,0);
      rawHead = { n:n, rate: base ? n/base : 0,
        issues: p.cat==="QC Failed" ? Object.values(map).reduce((a,b)=>a+b,0) : null };
      rows = Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([label,count])=>({ pt:state.granularity, p:latestPeriod, cat:p.cat,
        label:label, count:count, pct: base ? count/base : null }));
      if(!rows.length) rows=[{ pt:state.granularity, p:"\u2014none\u2014", cat:p.cat, label:"", count:0, pct:null }];
    }
    if(!rows) return "";

    if(p.kind==="table"){
      const cols=rows.cols||[], data=rows.rows||[];
      if(!data.length) return "";
      const cell=function(v){
        if(v==null||v==="") return "\u2014";
        if(typeof v==="string" && /^Date\(/.test(v)){
          const d=toDate(v);
          return d?esc(d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})):esc(v);
        }
        return typeof v==="number" ? v.toLocaleString("en-IN") : esc(v);
      };
      return '<section class="rcard ev-card"><div class="rcard-hd"><h3>'+esc(p.title)+'</h3>'+
        '<span class="rcard-rate" style="font-size:13px;color:var(--muted)">'+data.length+' logged</span></div>'+
        '<div class="scroll" style="max-height:none;border:0"><table class="records"><tr>'+
        cols.map(c=>'<th style="text-align:left">'+esc(c)+'</th>').join("")+'</tr><tbody>'+
        data.map(r=>'<tr>'+r.map(v=>'<td style="text-align:left">'+cell(v)+'</td>').join("")+'</tr>').join("")+
        '</tbody></table></div></section>';
    }

    if(p.kind==="reasons" && Array.isArray(rows) && p.cat){
      const want=normKey(p.cat);
      rows=rows.filter(r=>normKey(r.cat)===want);
    }
    /* Reasons follow the period filter when the sheet carries those columns. */
    if(p.kind==="reasons" && Array.isArray(rows) && rows.some(r=>r.p)){
      rows=rows.filter(r=>(!r.pt||r.pt===state.granularity) && r.p===latestPeriod);
      filtered=true;
      if(!rows.length) return '<section class="rcard"><div class="rcard-hd"><h3>'+esc(p.title)+'</h3></div>'+
        '<p style="margin:10px 0 14px;font-size:13px;color:var(--muted)">Nothing recorded for '+
        esc(rawOn(prod) ? periodLabel(latestPeriod||"").toLowerCase() : (latestPeriod||"this period"))+'.</p></section>';
    }
    if(!rows.length) return "";
    if(p.kind==="log"){
      const items=rows.map(function(r){
        return '<li class="ev"><div class="ev-when num">'+
          (r.at ? esc(r.at.toLocaleDateString("en-IN",{day:"2-digit",month:"short"})) : "\u2014")+'</div>'+
          '<div class="ev-body"><span class="ev-tag">'+esc(r.by||"\u2014")+'</span>'+
          '<p>'+esc(r.text)+'</p></div></li>';
      }).join("");
      return '<section class="rcard ev-card"><div class="rcard-hd"><h3>'+esc(p.title)+'</h3>'+
        '<span class="rcard-rate" style="font-size:13px;color:var(--muted)">'+rows.length+
        ' logged</span></div><ul class="evs">'+items+'</ul></section>';
    }
    const tone = p.tone==="amber" ? "var(--warn)" : p.tone==="muted" ? "var(--muted)" : "var(--down)";
    const rate = rawHead ? rawHead.rate : p.rate!=null ? p.rate : rows.reduce((a,r)=>a+(r.pct||0),0);
    const total= rawHead ? rawHead.n : p.total!=null ? p.total : rows.reduce((a,r)=>a+(r.count||0),0);
    const max  = Math.max.apply(null, rows.map(r=>r.count||0)) || 1;
    const body = rows.map(function(r){
      return '<li class="rsn"><div class="rsn-top"><span class="rsn-lab">'+esc(r.label)+'</span>'+
        '<span class="rsn-num num">'+(r.count||0).toLocaleString("en-IN")+
        ' <span class="rsn-dot">\u00b7</span> <b style="color:'+tone+'">'+pct(r.pct)+'</b></span></div>'+
        '<div class="rsn-track"><i style="width:'+Math.max(2,((r.count||0)/max)*100).toFixed(1)+
        '%;background:'+tone+'"></i></div></li>';
    }).join("");
    return '<section class="rcard"><div class="rcard-hd">'+
      '<h3>'+esc(p.title)+'</h3><span class="rcard-rate" style="color:'+tone+'">'+pct(rate)+'</span></div>'+
      '<div class="rcard-sub"><span>'+esc(p.subtitle||"")+(rawHead && rawHead.issues>rawHead.n
          ? ' \u00b7 '+rawHead.issues.toLocaleString("en-IN")+' issues on '+rawHead.n.toLocaleString("en-IN")+' spins'
          : (p.cat==="Not delivered yet" && rawHead ? '' : ' \u00b7 all reasons'))+'</span>'+
      '<span>'+(rawHead?'of all spins':'of reviewed')+' \u00b7 '+total.toLocaleString("en-IN")+'</span></div>'+
      '<ul class="rsns'+(p.noCap?" rsns--all":"")+'">'+body+'</ul></section>';
  }).join("");
  const shown=cards.split("<section").length-1;
  if(!cards.replace(/\s/g,"")) return "";
  return '<div class="sec"><h2>Fulfilment Gap Reasons</h2>'+
    (rawOn(prod) && periodsNow.length ? '<select class="sec-sel" id="issPeriod" aria-label="Period for the reasons">'+
      periodsNow.slice().reverse().map(x=>'<option value="'+esc(x)+'"'+(x===latestPeriod?' selected':'')+'>'+esc(periodLabel(x))+'</option>').join("")+
    '</select>' : '')+
    '<span class="note">'+(filtered
      ? esc(rawOn(prod)?periodLabel(latestPeriod||""):periodName(latestPeriod||""))+(rawOn(prod)?' \u00b7 follows every filter above \u00b7 the cards add up to the spins not delivered':' \u00b7 follows the period filter')
      : 'Fixed \u2014 not affected by the filters above')+'</span></div>'+
    '<div class="rgrid" style="--cols:'+Math.max(1,shown)+'">'+cards+'</div>';
}

async function loadQuality(prod){
  if(!prod || !prod.quality || !prod.quality.sheet) return null;
  try{
    const t=await fetchTable(prod.quality.sheet);
    const low=t.cols.map(c=>String(c.label||"").trim().toLowerCase());
    const at=re=>low.findIndex(l=>re.test(l));
    const i={ pt:at(/^period_type$|^granularity$/), p:at(/^period$/),
              tot:at(/total/), del:at(/deliver/),
              rev:at(/review/), pass:at(/pass/), iss:at(/issue_count|^issues?$/),
              ipct:at(/issue_pct|issue_%/) };
    return t.rows.map(function(r){
      const g=k=> (i[k]>=0 && r.c && r.c[i[k]] && r.c[i[k]].v!=null) ? r.c[i[k]].v : null;
      const rev=Number(g("rev")), iss=Number(g("iss"));
      let ip=g("ipct");
      /* issue_pct is blank on some rows - derive it rather than drop the point. */
      if(ip==null && rev>0 && !isNaN(iss)) ip=(iss/rev)*100;
      const nz=k=>{ const v=g(k); return v==null?null:Number(v); };
      return { pt:normGran(g("pt")), p:g("p")==null?null:String(g("p")).trim(),
               total:nz("tot"), delivered:nz("del"),
               reviewed:isNaN(rev)?null:rev, passed:nz("pass"),
               issues:isNaN(iss)?null:iss, issuePct:ip==null?null:Number(ip) };
    }).filter(x=>x.p);
  }catch(e){ return null; }
}
/* Reviewed and passed as bars on the right, issue rate as a line on the left. */
function qualityHTML(){
  const prod=PRODUCTS.find(p=>p.id===state.product);
  if(!prod || !prod.quality || !state.qualities[state.product]) return "";
  const periods=periodsOf();
  const byP=new Map();
  state.qualities[state.product].forEach(function(r){ if(!r.pt||r.pt===state.granularity) byP.set(r.p,r); });
  const rows=periods.map(p=>byP.get(p)||null);
  if(!rows.some(r=>r&&r.reviewed!=null)) return "";

  const W=1000,H=300,padL=58,padR=64,padT=30,padB=40;
  const base=H-padB, n=periods.length, inner=W-padL-padR;
  const pcts=rows.filter(r=>r&&r.issuePct!=null).map(r=>r.issuePct);
  const cnts=rows.filter(r=>r).map(r=>Math.max(r.reviewed||0,r.passed||0));
  const pmax=Math.max(1, Math.max.apply(null,pcts.length?pcts:[1])*1.3);
  const cmax=Math.max(1, Math.max.apply(null,cnts.length?cnts:[1])*1.15);
  const x=i=> padL+inner*(i+0.5)/n;
  const yp=v=> base-(base-padT)*(v/pmax);
  const yc=v=> base-(base-padT)*(v/cmax);
  const slot=(inner/n)*0.5;
  const fmtC=v=> v>=1000 ? (v/1000).toFixed(v>=10000?0:1)+"k" : String(Math.round(v));

  let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="300" role="img" aria-label="Quality">';
  svg+='<line x1="'+padL+'" y1="'+base+'" x2="'+(W-padR)+'" y2="'+base+'" stroke="var(--hair-strong)"/>';
  for(let k=0;k<=3;k++){
    const t=k/3, yy=base-(base-padT)*t;
    if(k) svg+='<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yy.toFixed(1)+
               '" stroke="var(--hair)" stroke-dasharray="3 4"/>';
    svg+='<text x="'+(padL-9)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--down)">'+
         (pmax*t).toFixed(1)+'%</text>';
    svg+='<text x="'+(W-padR+9)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="start" font-size="11" fill="var(--orange)">'+
         fmtC(cmax*t)+'</text>';
  }
  /* Same stack as the fulfilment card: passed in green from the baseline,
     the rest of what was reviewed sitting on top in orange. */
  rows.forEach(function(r,i){
    if(!r || r.reviewed==null) return;
    const bx=(x(i)-slot/2).toFixed(1);
    const passed = r.passed==null ? null : r.passed;
    if(passed!=null) svg+='<rect x="'+bx+'" y="'+yc(passed).toFixed(1)+'" width="'+slot.toFixed(1)+
      '" height="'+Math.max(1,base-yc(passed)).toFixed(1)+'" fill="var(--up)" opacity=".9"/>';
    const gap = passed==null ? r.reviewed : Math.max(0, r.reviewed-passed);
    if(gap>0) svg+='<rect x="'+bx+'" y="'+yc(r.reviewed).toFixed(1)+'" width="'+slot.toFixed(1)+
      '" height="'+Math.max(1, yc(passed==null?0:passed)-yc(r.reviewed)).toFixed(1)+
      '" rx="3" fill="var(--orange)" opacity=".9"/>';
  });
  rows.forEach(function(r,i){
    if(!r) return;
    const L=(k,v)=>v==null?null:'<span style="color:#9DB4B1">'+k+'</span> <b>'+v+'</b>';
    const num=v=>v==null?null:Number(v).toLocaleString("en-IN");
    const body=[ '<b>'+esc(periods[i])+'</b>',
      L("Total videos", num(r.total)), L("Delivered", num(r.delivered)),
      L("Reviewed", num(r.reviewed)), L("Passed", num(r.passed)),
      L("Issues", num(r.issues)),
      L("Issue rate", r.issuePct==null?null:r.issuePct.toFixed(1)+"%") ].filter(Boolean).join("<br>");
    svg+='<rect class="pt" x="'+(padL+inner*i/n).toFixed(1)+'" y="'+padT+'" width="'+(inner/n).toFixed(1)+
         '" height="'+(base-padT).toFixed(1)+'" fill="transparent" pointer-events="all" data-tip="'+
         body.replace(/"/g,"&quot;")+'"></rect>';
  });
  const pts=[]; rows.forEach((r,i)=>{ if(r&&r.issuePct!=null) pts.push([x(i),yp(r.issuePct),i,r.issuePct,r]); });
  if(pts.length>1) svg+='<path d="'+pts.map((p,k)=>(k?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")+
    '" fill="none" stroke="var(--down)" stroke-width="2.4" stroke-linejoin="round"/>';
  pts.forEach(function(p){
    svg+='<circle class="pt" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.5" fill="var(--panel)" '+
         'stroke="var(--down)" stroke-width="2.4" data-label="Issue rate" data-x="'+esc(periods[p[2]])+
         '" data-v="'+esc(p[3].toFixed(1)+"% \u00b7 "+(p[4].issues==null?"?":p[4].issues)+" issues")+'"></circle>';
    svg+='<text x="'+p[0].toFixed(1)+'" y="'+Math.max(16,p[1]-11).toFixed(1)+'" text-anchor="middle" '+
         'font-size="11.5" font-weight="600" fill="var(--down)">'+p[3].toFixed(1)+'%</text>';
  });
  periods.forEach((lab,i)=>{
    svg+='<text x="'+x(i).toFixed(1)+'" y="'+(H-14)+'" text-anchor="middle" font-size="12" font-weight="500" fill="var(--ink-2)">'+esc(lab)+'</text>';
  });
  svg+='</svg>';
  return '<div class="sec"><h2>'+esc(prod.quality.title||"Quality")+'</h2>'+
    '<span class="note">From the '+esc(prod.quality.sheet)+' tab \u00b7 issue rate on the left, counts on the right \u00b7 hover for numbers</span></div>'+
    '<div class="panel">'+svg+
    '<div class="legend"><span><span class="swatch" style="background:var(--up)"></span>Passed</span>'+
    '<span><span class="swatch" style="background:var(--orange)"></span>Not passed</span>'+
    '<span><span class="swatch" style="background:var(--down)"></span>Issue rate</span>'+
    '<span style="color:var(--muted)">bar height = reviewed</span></div></div>';
}
