/* ---------- selectors ---------- */
function lanesOf(){ return (PRODUCTS.find(p=>p.id===state.product)||{lanes:[]}).lanes; }
function laneById(id){ return lanesOf().find(l=>l.id===id); }
function rowsFor(laneId){
  return laneSetRows(laneId, raw(laneId)).filter(r=>r.granularity===state.granularity).sort(comparePeriods);
}
function laneSetRows(laneId, rows){
  if(isRaw()) return rows;   /* raw: the lanes are recomputed for the selected regions */
  /* VIN/Spin and Rooftop follow the region chips. Images keeps every set of regions in the lane's
     own sheet (region_set column, one row per set incl. all regions); 360 and Video keep the subsets
     in a separate <sheet>_byregion tab. */
  if(laneId!=="region"){
    const rk=regionKey();
    if(rows.some(r=>r.regionSet)){
      if(rk) rows=rows.filter(r=>r.regionSet===rk);
      else{   /* all regions: the widest set in the sheet */
        const n=r=>r.regionSet?r.regionSet.split(",").length:0, max=Math.max.apply(null,rows.map(n));
        rows=rows.filter(r=>n(r)===max);
      }
    } else if(rk){
      const br=state.data[brKey(laneId)];
      if(br) rows=br.filter(r=>r.regionSet===rk);
    }
  }
  return rows;
}
function allRegions(){
  /* Raw 360: every region in the data, so the chips (and the region filter) never depend on what
     the other filters leave in the Region lane — e.g. after Source "Clear all" empties it. */
  if(isRaw() && state.rawRows[state.product]) return Engine360.values(state.rawRows[state.product],'region');
  const s=new Set();
  raw("region").forEach(r=>{ if(r.region) s.add(r.region); });
  return [...s].sort();
}
function activeRegions(){
  const all=allRegions();
  const sel=all.filter(r=>regSet().has(r));
  return sel.length?sel:all;
}
/* Region sets: the VIN/Spin and Rooftop metrics for every combination of regions, keyed by
   region_set = sorted region names joined by commas (e.g. "AMER,EMEA"). Images has them in the
   lane's own sheet; 360/Video in <sheet>_byregion. With every region selected, regionKey() is null. */
function regionKey(){
  const a=activeRegions(), all=allRegions();
  return (a.length && a.length<all.length) ? [...a].sort().join(",") : null;
}
function brKey(laneId){ return key(laneId)+"@byregion"; }
/* null = this product's sheet has no region split yet; the lane then stays on all regions. */
function hasInlineSets(laneId){ return raw(laneId).some(r=>r.regionSet); }
function regionSplitMissing(laneId){ if(isRaw()) return false; return laneId!=="region" && !!regionKey() && !hasInlineSets(laneId) && state.data[brKey(laneId)]===null; }
async function ensureByRegion(){
  if(isRaw()) return false;
  if(!regionKey()) return false;
  const lanes=lanesOf().filter(l=>l.dim!=="region" && !hasInlineSets(l.id) && state.data[brKey(l.id)]===undefined);
  if(!lanes.length) return false;
  const res=await Promise.all(lanes.map(l=>loadSheet(laneSheet(l)+"_byregion").catch(()=>null)));
  lanes.forEach((l,i)=>{ state.data[brKey(l.id)]=(res[i]&&res[i].length)?res[i]:null; });
  return true;
}
function col(metricId){ return (SEGMENTS.find(s=>s.id===state.segment)||SEGMENTS[0]).prefix+metricId; }
/* The weekly report runs W-1 (last complete week) to W-4. W-0, the week in
   progress, is dropped wherever it turns up. */
function isShownPeriod(p){ const u=String(p).trim().toUpperCase(); return u!=="W-0" && u!=="D-0"; }
function periodsOf(){
  const ls=lanesOf(), a=ls[0]?rowsFor(ls[0].id):[], b=ls[1]?rowsFor(ls[1].id):[];
  const src=a.length?a:b;
  const out=[],seen=new Set();
  src.forEach(r=>{ if(!seen.has(r.period) && isShownPeriod(r.period)){ seen.add(r.period); out.push(r.period); }});
  if(out.length) return out;
  const set=new Set(); rowsFor("region").forEach(r=>{ if(isShownPeriod(r.period)) set.add(r.period); });
  return [...set];
}
/* region lane: mean across the regions in play, per period */
function regionSeries(colName, regionFilter){
  const rows=rowsFor("region"), keep=regionFilter||activeRegions();
  const byPeriod=new Map();
  rows.forEach(r=>{
    if(!keep.includes(r.region)) return;
    const val=r.v[colName];
    if(val==null||isNaN(val)) return;
    if(!byPeriod.has(r.period)) byPeriod.set(r.period,[]);
    byPeriod.get(r.period).push(val);
  });
  return periodsOf().map(p=>{
    const a=byPeriod.get(p);
    return a&&a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  });
}
function segPrefix(){ return (SEGMENTS.find(s=>s.id===state.segment)||SEGMENTS[0]).prefix; }
/* Combine one column across the periods in view. Rates average across regions,
   totals add up - averaging a cost would understate it badly. */
function aggSeries(laneId, colName, mode, regionsOverride, skipZero){
  const gone=v=>(v==null||isNaN(v)||(skipZero&&v===0));
  if(laneId!=="region"){
    const map=new Map(rowsFor(laneId).map(r=>[r.period, r.v[colName]]));
    return periodsOf().map(p=>{ const v=map.get(p); return gone(v)?null:v; });
  }
  const keep=regionsOverride||activeRegions();
  const byPeriod=new Map();
  rowsFor("region").forEach(r=>{
    if(keep.indexOf(r.region)<0) return;
    const v=r.v[colName];
    if(gone(v)) return;
    if(!byPeriod.has(r.period)) byPeriod.set(r.period,[]);
    byPeriod.get(r.period).push(v);
  });
  return periodsOf().map(p=>{
    const a=byPeriod.get(p);
    if(!a||!a.length) return null;
    const total=a.reduce((x,y)=>x+y,0);
    return mode==="sum" ? total : total/a.length;
  });
}
/* Segment count columns are named two ways, so try both. With a segment selected and no
   column for it, return nothing rather than the all-segment count - that showed the wrong
   segment's Total/Delivered in the fulfilment tooltip and bars. */
function countSeries(laneId, name, prefix, regionsOverride){
  const px = prefix!=null ? prefix : segPrefix();
  if(px){
    /* ent_total_in / ent_total_videos (images, video) and total_ent_vin (360) are both in use. */
    const tries=[ px+name, name.replace(/^total_/, "total_"+px) ];
    for(let i=0;i<tries.length;i++){
      if(tries[i]===name) continue;
      const got=aggSeries(laneId, tries[i], "sum", regionsOverride);
      if(got.some(v=>v!=null)) return got;
    }
    return periodsOf().map(()=>null);
  }
  return aggSeries(laneId, name, "sum", regionsOverride);
}
/* Count series for a metric's tooltip, or null when the sheet has no such columns.
   Read with the segment prefix only - falling back to the all-segment column
   would put one segment's population next to another's breaches. */
function tipCounts(laneId, metric, regionsOverride){
  if(!metric.tip) return null;
  const px=segPrefix();
  const n=aggSeries(laneId, px+metric.tip.n, "sum", regionsOverride);
  const bad=aggSeries(laneId, px+metric.tip.bad, "sum", regionsOverride);
  return n.some(v=>v!=null) ? { n:n, bad:bad } : null;
}
/* Same layout as the fulfilment tooltip: period, the counts, then the value.
   Rooftop cards count rooftops, everything else counts SKUs. */
function tipHTML(metric, lab, v, counts, i, unit){
  const line=(k,val)=>'<span style="color:#9DB4B1">'+k+'</span> <b>'+val+'</b>';
  const num=x=>Math.round(x).toLocaleString("en-IN");
  const t=metric.tip, n=counts?counts.n[i]:null, bad=counts?counts.bad[i]:null;
  return [ '<b>'+esc(lab)+'</b>'+(unit&&n!=null?' <span style="color:#9DB4B1">'+esc(unit)+'</span>':''),
    n!=null?line(t.nLabel, num(n)):null,
    (n!=null&&bad!=null)?line(t.goodLabel, num(n-bad)):null,
    bad!=null?line(t.badLabel, num(bad)):null,
    v!=null?line(esc(metric.label), fmt(metric,v)):null ].filter(Boolean).join("<br>").replace(/"/g,"&quot;");
}
function metricSeries(laneId, metric, prefix, regionsOverride){
  if(metric.src==="bq") return costSeries(laneId, metric, prefix, regionsOverride);
  const px = prefix!=null ? prefix : segPrefix();
  if(metric.agg==="ratio"){
    const n=aggSeries(laneId, px+metric.num, "sum", regionsOverride);
    const d=aggSeries(laneId, px+metric.den, "sum", regionsOverride);
    return n.map((v,i)=> (v==null||d[i]==null||!d[i]) ? null : v/d[i]);
  }
  /* A 0% SLA or 0h TAT is a region that did no work that period, not a real
     reading - averaging it in drags the roll-up down to nothing. */
  const skipZero = metric.kind==="pct" || metric.kind==="hrs";
  return aggSeries(laneId, px+metric.id, metric.agg||"mean", regionsOverride, skipZero);
}
function valueAt(row, metric, prefix){
  const px = prefix!=null ? prefix : segPrefix();
  if(metric.agg==="ratio"){
    const n=row.v[px+metric.num], d=row.v[px+metric.den];
    return (n==null||d==null||!d||isNaN(n)||isNaN(d)) ? null : n/d;
  }
  const v=row.v[px+metric.id];
  return (v==null||isNaN(v)) ? null : v;
}
function laneSeries(laneId, colName){
  if(laneId==="region") return regionSeries(colName);
  const map=new Map(rowsFor(laneId).map(r=>[r.period, r.v[colName]]));
  return periodsOf().map(p=>{ const v=map.get(p); return (v==null||isNaN(v))?null:v; });
}
function lastTwo(series){
  const idx=[]; series.forEach((v,i)=>{ if(v!=null) idx.push(i); });
  const n=idx.length;
  return { cur:n?series[idx[n-1]]:null, prev:n>1?series[idx[n-2]]:null,
           curIdx:n?idx[n-1]:null, prevIdx:n>1?idx[n-2]:null };
}

/* ---------- formatting ---------- */
function fmt(metric,v){
  if(v==null||isNaN(v)) return "\u2014";
  if(metric.kind==="pct")  return v.toFixed(1)+"%";
  if(metric.kind==="int")  return Math.round(v).toLocaleString("en-IN");
  if(metric.kind==="inr2") return "\u20b9"+v.toFixed(2);
  if(metric.kind==="inr"){
    if(v>=1e7) return "\u20b9"+(v/1e7).toFixed(2)+" Cr";
    if(v>=1e5) return "\u20b9"+(v/1e5).toFixed(2)+" L";
    return "\u20b9"+Math.round(v).toLocaleString("en-IN");
  }
  return v>=100 ? Math.round(v).toLocaleString("en-IN")+"h" : v.toFixed(1)+"h";
}
function fmtDelta(metric,cur,prev){
  if(cur==null||prev==null) return null;
  if(sameDisplay(metric,cur,prev)) return { txt:"no change", tone:"flat" };
  const d=cur-prev;
  const sign=d>=0?"+":"\u2212", a=Math.abs(d);
  const txt = metric.kind==="pct" ? sign+a.toFixed(1)+" pp"
    : (metric.kind==="inr"||metric.kind==="inr2"||metric.kind==="int")
      ? sign+fmt(metric,a).replace("\u20b9","\u20b9")
      : sign+(a>=100?Math.round(a):a.toFixed(1))+"h";
  const good = metric.better==="high" ? d>0 : d<0;
  return { txt, tone: good?"up":"down" };
}
function periodName(p){
  const map={ "MTD":"Month to date","M-1":"Last month","M-2":"2 months back","M-3":"3 months back","M-4":"4 months back",
              "W-1":"This week","W-2":"Last week","W-3":"2 weeks back","W-4":"3 weeks back" };
  return map[p]||p;
}
/* 360 names: W-1 is the last complete Mon–Sun week (the week in progress is left out), so it is
   "Last week", not "This week". Images and Video keep periodName. */
const RAW_WEEK_NAMES = { "W-1":"Last week", "W-2":"2 weeks back", "W-3":"3 weeks back", "W-4":"4 weeks back" };
function periodLabel(p){
  if(RAW_WEEK_NAMES[p]) return RAW_WEEK_NAMES[p];
  const d=/^D-(\d+)$/.exec(String(p));
  if(!d) return periodName(p);
  const row=raw(lanesOf()[0].id).find(r=>r.period===p);
  const dt=row && row.date ? ' ('+row.date.getUTCDate()+'/'+(row.date.getUTCMonth()+1)+')' : '';   /* periods are UTC days */
  return (d[1]==='1' ? 'Yesterday' : d[1]+' days back')+dt;
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

/* ---------- svg charts ---------- */
/* Every line is coloured step by step: each leg is judged only against the
   point before it, green when the move is good for that metric, red when not. */
/* Two values that print the same are treated as unchanged. Otherwise a card can
   read 100.0% -> 100.0% and still colour the leg red, which just looks broken. */
function sameDisplay(metric,a,b){
  if(a==null||b==null||isNaN(a)||isNaN(b)) return false;
  return fmt(metric,a)===fmt(metric,b);
}
function stepTone(metric,prev,cur){
  if(prev==null||cur==null||isNaN(prev)||isNaN(cur)) return "flat";
  if(sameDisplay(metric,prev,cur)) return "flat";
  const d=cur-prev;
  if(Math.abs(d)<0.0005) return "flat";
  return (metric.better==="high" ? d>0 : d<0) ? "up" : "down";
}
function toneColor(t){ return t==="up"?"var(--up)":t==="down"?"var(--down)":"var(--flat)"; }
/* Keep small movements looking small. */
function regionColor(r){
  const i=allRegions().indexOf(r);
  return SERIES_COLORS[(i<0?0:i)%SERIES_COLORS.length];
}
/* One line per region on the region card, coloured to match the chips. */
/* Percentage as a line against the left axis, counts as bars against the
   right. Two scales in one card, so both axes are labelled. */
/* One size and style for every value label on the cards, and one for the period
   axis - so VIN, Rooftop and Region read identically. Values are drawn vertical
   (rotate -90) above the bar so adjacent numbers never crowd each other. */
const BAR_LABEL_FS=7.5, AXIS_LABEL_FS=10;
function barLabel(cx, topY, text, color, fs){
  return '<text transform="translate('+(+cx).toFixed(1)+','+(+topY-4).toFixed(1)+') rotate(-90)" '+
    'text-anchor="start" font-size="'+(fs||BAR_LABEL_FS)+'" font-weight="600" fill="'+color+'">'+text+'</text>';
}
function sparkCombo(pctSeries, metric, labels, num, den){
  const pv=pctSeries.filter(v=>v!=null);
  const cv=den.concat(num).filter(v=>v!=null);
  if(!pv.length || !cv.length) return sparkline(pctSeries, metric, labels);
  const W=268,H=140,padB=20,padL=26,padR=32;
  /* Reserve a band at the top for the vertical value labels, so they sit clear
     above the count bars and the % line instead of colliding with them. */
  const _lp=Math.max.apply(null, pv.map(v=>fmt(metric,v).length));
  /* Top-band labels are on Images only for now (staging preview); other products
     keep the compact top padding until we decide to roll it out. */
  const topBand = state.product==="images";
  const padT = topBand ? Math.max(28, 8+_lp*BAR_LABEL_FS*0.62) : 24;
  const base=H-padB, n=labels.length, inner=W-padL-padR;
  const pr=niceRange(metric, Math.min.apply(null,pv), Math.max.apply(null,pv));
  const pspan=(pr.hi-pr.lo)||1;
  const cmax=Math.max.apply(null,cv)*1.15 || 1;          // counts read from zero
  const x=i=> padL+inner*(i+0.5)/n;
  const yp=v=> padT+(base-padT)*(1-(v-pr.lo)/pspan);
  const yc=v=> base-(base-padT)*(v/cmax);
  const slot=(inner/n)*0.56;
  const fmtC=v=> v>=1000 ? (v/1000).toFixed(v>=10000?0:1)+"k" : String(Math.round(v));

  let svg='<svg class="spark" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" '+
    'role="img" aria-label="'+esc(metric.label)+' with volume">';
  svg+='<line x1="'+padL+'" y1="'+base+'" x2="'+(W-padR)+'" y2="'+base+'" stroke="var(--hair-strong)" stroke-width="1"/>';
  for(let k=0;k<=2;k++){
    const t=k/2, yy=padT+(base-padT)*(1-t);
    if(k) svg+='<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yy.toFixed(1)+
               '" stroke="var(--hair)" stroke-width="0.7" stroke-dasharray="2 3"/>';
    svg+='<text x="'+(padL-4)+'" y="'+(yy+2.4).toFixed(1)+'" text-anchor="end" font-size="6.5" fill="var(--muted)">'+
         (pr.lo+pspan*t).toFixed(1)+'</text>';
    svg+='<text x="'+(W-padR+4)+'" y="'+(yy+2.4).toFixed(1)+'" text-anchor="start" font-size="6.5" fill="var(--orange)">'+
         fmtC(cmax*t)+'</text>';
  }
  labels.forEach(function(lab,i){
    const t=den[i], d=num[i];
    /* One bar per period: delivered in green from the baseline, the shortfall
       stacked on top in orange. Numbers live in the tooltip. */
    const bx=(x(i)-slot/2).toFixed(1);
    if(d!=null) svg+='<rect x="'+bx+'" y="'+yc(d).toFixed(1)+'" width="'+slot.toFixed(1)+
      '" height="'+Math.max(0.6,base-yc(d)).toFixed(1)+'" fill="var(--up)" opacity=".9"/>';
    if(t!=null && d!=null && t>d) svg+='<rect x="'+bx+'" y="'+yc(t).toFixed(1)+'" width="'+slot.toFixed(1)+
      '" height="'+Math.max(0.6,yc(d)-yc(t)).toFixed(1)+'" rx="1.5" fill="var(--orange)" opacity=".9"/>';
    else if(t!=null && d==null) svg+='<rect x="'+bx+'" y="'+yc(t).toFixed(1)+'" width="'+slot.toFixed(1)+
      '" height="'+Math.max(0.6,base-yc(t)).toFixed(1)+'" rx="1.5" fill="var(--orange)" opacity=".9"/>';
  });
  labels.forEach(function(lab,i){
    const t=den[i], d=num[i], p=pctSeries[i];
    const nm=(metric.combo&&metric.combo.numLabel)||"Delivered";
    const dn=(metric.combo&&metric.combo.denLabel)||"Total";
    const line=(k,v)=>'<span style="color:#9DB4B1">'+k+'</span> <b>'+v+'</b>';
    const body=[ '<b>'+esc(lab)+'</b>',
      t!=null?line(dn, Math.round(t).toLocaleString("en-IN")):null,
      d!=null?line(nm, Math.round(d).toLocaleString("en-IN")):null,
      (t!=null&&d!=null)?line("Shortfall", Math.round(t-d).toLocaleString("en-IN")):null,
      p!=null?line(esc(metric.label), fmt(metric,p)):null ].filter(Boolean).join("<br>");
    svg+='<rect class="pt" x="'+(padL+inner*i/n).toFixed(1)+'" y="'+padT+'" width="'+(inner/n).toFixed(1)+
         '" height="'+(base-padT).toFixed(1)+'" fill="transparent" pointer-events="all" data-tip="'+
         body.replace(/"/g,"&quot;")+'"></rect>';
  });
  const pts=[]; pctSeries.forEach((v,i)=>{ if(v!=null) pts.push([x(i),yp(v),i,v]); });
  for(let k=1;k<pts.length;k++){
    const a=pts[k-1],b=pts[k],c=toneColor(stepTone(metric,a[3],b[3]));
    svg+='<path d="M'+a[0].toFixed(1)+' '+a[1].toFixed(1)+' L'+b[0].toFixed(1)+' '+b[1].toFixed(1)+
         '" fill="none" stroke="'+c+'" stroke-width="2" stroke-linecap="round"/>';
  }
  pts.forEach(function(p,k){
    const c=toneColor(k===0?stepTone(metric,pts[1]?p[3]:null,pts[1]?pts[1][3]:null):stepTone(metric,pts[k-1][3],p[3]));
    svg+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(k===pts.length-1?3.2:2.2)+
         '" fill="'+(k===pts.length-1?c:"var(--panel)")+'" stroke="'+c+'" stroke-width="1.6"/>';
    /* Images: label goes in the top band (aligned over its bar), not on the point,
       so the vertical number never overlaps the count bar or the % line below it.
       Other products keep the at-point label for now. */
    svg+=barLabel(p[0], topBand ? padT-2 : p[1], fmt(metric,p[3]), c);
  });
  labels.forEach((lab,i)=>{
    svg+='<text x="'+x(i).toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle" font-size="'+AXIS_LABEL_FS+'" fill="var(--muted)">'+esc(lab)+'</text>';
  });
  return svg+'</svg>';
}
/* Region points: the counts tooltip for that one region, titled with its name. */
function regionTip(metric, sr, labels, i, v){
  if(!metric.tip || !sr.counts) return '';
  return ' data-tip="'+tipHTML(metric, (labels[i]||"")+' · '+sr.name, v, sr.counts, i, null)+'"';
}
function sparkMulti(seriesList, metric, labels){
  const all=[]; seriesList.forEach(s=>s.values.forEach(v=>{ if(v!=null) all.push(v); }));
  if(all.length<2) return '<div class="spark" style="height:136px"></div>';
  const W=268,H=140,padT=30,padB=20,padL=12,padR=12;
  const base=H-padB, n=labels.length;
  let padTop=padT, bar=null;
  if(state.chart==="bar"){
    const m=seriesList.length||1;
    /* Bars sit in per-period slots, not on the line positions - centring a
       group on x(0) hangs half of it off the left edge. */
    const slot=((W-padL-padR)/n) * 0.8;
    const bw=Math.max(1.3, slot/m);
    /* Standard label size when bars are wide (one region on screen); shrinks only
       when several regions share a period and the bars get narrow. */
    const fs=Math.max(6, Math.min(BAR_LABEL_FS, bw*1.3));
    /* Labels always sit above their bar, so the plot has to start low enough
       that even a full-height bar leaves room for one. */
    const longest=Math.max.apply(null, all.map(v=>fmt(metric,v).length));
    padTop=Math.min(H*0.46, 7+longest*fs*0.62);
    bar={m:m, slot:slot, bw:bw, fs:fs};
  }
  const sc=makeScale(metric, all, padTop, base);
  const inner=W-padL-padR;
  const x=i=> bar ? padL+inner*(i+0.5)/n
                  : (n>1 ? padL+i*inner/(n-1) : padL+inner/2);
  const y=sc.y;
  let svg='<svg class="spark" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" '+
    'role="img" aria-label="'+esc(metric.label)+' by region">';
  svg+='<line x1="0" y1="'+base+'" x2="'+W+'" y2="'+base+'" stroke="var(--hair-strong)" stroke-width="1"/>';
  /* Labels sit on their points, and any that would collide is dropped rather
     than stacked - the strip underneath always carries the current value. */
  const placed=[];
  if(bar){
    /* Coloured by movement, like the VIN and rooftop cards - each bar against
       that region's own previous period. Hover says which region it is. */
    seriesList.forEach(function(sr,si){
      let prev=null;
      sr.values.forEach(function(v,i){
        if(v==null) return;
        const c=toneColor(stepTone(metric, prev, v));
        prev=v;
        const cx=x(i)-bar.slot/2+bar.bw*si+bar.bw/2, yy=y(v), h=Math.max(1, base-yy);
        svg+='<rect class="pt" x="'+(cx-bar.bw/2+0.45).toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+
             Math.max(0.9,bar.bw-0.9).toFixed(1)+'" height="'+h.toFixed(1)+
             '" rx="1" fill="'+c+'" opacity=".9" data-label="'+esc(sr.name)+'" data-x="'+
             esc(labels[i]||"")+'" data-v="'+esc(fmt(metric,v))+'"'+regionTip(metric, sr, labels, i, v)+'></rect>';
        svg+=barLabel(cx, yy, fmt(metric,v), c, bar.fs);
      });
    });
    labels.forEach((lab,i)=>{
      svg+='<text x="'+x(i).toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle" font-size="'+AXIS_LABEL_FS+'" fill="var(--muted)">'+esc(lab)+'</text>';
    });
    return svg+'</svg>';
  }
  seriesList.forEach(function(sr){
    const pts=[];
    sr.values.forEach((v,i)=>{ if(v!=null) pts.push([x(i),y(v),i,v]); });
    if(!pts.length) return;
    for(let k=1;k<pts.length;k++){
      const a=pts[k-1], b=pts[k];
      svg+='<path d="M'+a[0].toFixed(1)+' '+a[1].toFixed(1)+' L'+b[0].toFixed(1)+' '+b[1].toFixed(1)+
           '" fill="none" stroke="'+toneColor(stepTone(metric,a[3],b[3]))+
           '" stroke-width="1.8" stroke-linecap="round" opacity=".9"/>';
    }
    pts.forEach(function(p,k){
      const isLast=k===pts.length-1;
      const c=toneColor(stepTone(metric, k?pts[k-1][3]:null, p[3]));
      svg+='<circle class="pt" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(isLast?2.8:1.9)+
           '" fill="'+c+'" data-label="'+esc(sr.name)+'" data-x="'+esc(labels[p[2]]||"")+
           '" data-v="'+esc(fmt(metric,p[3]))+'"'+regionTip(metric, sr, labels, p[2], p[3])+'></circle>';
      const ly=p[1]-5;
      if(ly<9) return;
      if(placed.some(q=>Math.abs(q[0]-p[0])<26 && Math.abs(q[1]-ly)<7)) return;
      placed.push([p[0],ly]);
      svg+='<text x="'+p[0].toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle" font-size="'+BAR_LABEL_FS+'" '+
           'font-weight="600" fill="'+c+'">'+fmt(metric,p[3])+'</text>';
    });
  });
  labels.forEach((lab,i)=>{
    svg+='<text x="'+x(i).toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle" font-size="'+AXIS_LABEL_FS+'" fill="var(--muted)">'+esc(lab)+'</text>';
  });
  return svg+'</svg>';
}
/* One place that decides how values map to pixels, so cards and the trend
   chart agree. Log needs every value above zero, so it quietly stays linear
   when a series contains a zero or a blank. */
function makeScale(metric, vals, padT, base){
  const useLog = state.scale==="log" && vals.length && Math.min.apply(null,vals)>0;
  if(useLog){
    const t=v=>Math.log10(v);
    let lo=t(Math.min.apply(null,vals)), hi=t(Math.max.apply(null,vals));
    if(hi-lo<0.08){ const m=(hi+lo)/2; lo=m-0.08; hi=m+0.08; }
    else { const p=(hi-lo)*0.10; lo-=p; hi+=p; }
    const span=hi-lo;
    return { log:true, y:v=>padT+(base-padT)*(1-(t(v)-lo)/span), at:u=>Math.pow(10,lo+span*u) };
  }
  const r=niceRange(metric, Math.min.apply(null,vals), Math.max.apply(null,vals));
  const span=(r.hi-r.lo)||1;
  return { log:false, y:v=>padT+(base-padT)*(1-(v-r.lo)/span), at:u=>r.lo+span*u };
}
function niceRange(metric, min, max){
  let lo=min, hi=max;
  const level=Math.abs((min+max)/2)||1;
  const floor = metric.kind==="pct" ? 2 : level*0.08;
  /* Nothing moved at all: centre it, and skip the ceiling clamp so a flat 100%
     doesn't pin to the top and fill the card with one solid block. */
  if(max===min) return { lo:min-floor/2, hi:min+floor/2 };
  if(hi-lo < floor){
    const mid=(hi+lo)/2;
    lo=mid-floor/2; hi=mid+floor/2;
  } else {
    const pad=(hi-lo)*0.12; lo-=pad; hi+=pad;
  }
  if(metric.kind==="pct"){
    if(hi>100){ const over=hi-100; hi-=over; lo-=over; }
    if(lo<0){ hi-=lo; lo=0; }
  } else if(lo<0) { hi-=lo; lo=0; }
  return {lo:lo, hi:hi};
}

function sparkline(series,metric,labels,counts,unit){
  const idx=[]; series.forEach((v,i)=>{ if(v!=null) idx.push(i); });
  if(idx.length<2) return '<div class="spark" style="height:136px"></div>';
  const W=268,H=140,padB=20,padX=24;
  const bars=state.chart==="bar";
  const vals=idx.map(i=>series[i]);
  /* Percentages get at least 2pp of visible range, other metrics at least 8%
     of their own level. Without a floor, a 0.1pp wobble fills the whole card
     and reads as a collapse. A dead-flat series lands mid-height. */
  /* Vertical bar labels sit above the bar, so leave headroom for the longest one. */
  const _lp=Math.max.apply(null, vals.map(v=>fmt(metric,v).length));
  const padT = bars ? Math.min(H*0.5, 10+_lp*BAR_LABEL_FS*0.6) : 22;
  const n=series.length, base=H-padB;
  const sc=makeScale(metric, vals, padT, base);
  const x=i=> n>1 ? padX+i*(W-padX*2)/(n-1) : W/2;
  const y=sc.y;
  const pts=idx.map(i=>[x(i),y(series[i]),i]);
  const tones=pts.map((p,k)=> k===0 ? null : stepTone(metric,series[pts[k-1][2]],series[p[2]]));
  let svg='<svg class="spark" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="'+
    esc(metric.label)+' trend">';
  svg+='<line x1="0" y1="'+base+'" x2="'+W+'" y2="'+base+'" stroke="var(--hair-strong)" stroke-width="1"/>';
  if(bars){
    const bw=Math.min(26, (n>1 ? (W-padX*2)/(n-1) : W*0.4) * 0.5);
    pts.forEach(function(p,k){
      const c=toneColor(k===0?tones[1]:tones[k]);
      const h=Math.max(1, base-p[1]);
      svg+='<rect x="'+(p[0]-bw/2).toFixed(1)+'" y="'+p[1].toFixed(1)+'" width="'+bw.toFixed(1)+
           '" height="'+h.toFixed(1)+'" rx="2" fill="'+c+'" opacity="'+(k===pts.length-1?".95":".55")+'"/>';
      svg+=barLabel(p[0], p[1], fmt(metric,series[p[2]]), c);
    });
  } else {
  for(let k=1;k<pts.length;k++){
    const a=pts[k-1],b=pts[k],c=toneColor(tones[k]);
    svg+='<path d="M'+a[0].toFixed(1)+' '+a[1].toFixed(1)+' L'+b[0].toFixed(1)+' '+b[1].toFixed(1)+
         ' L'+b[0].toFixed(1)+' '+base+' L'+a[0].toFixed(1)+' '+base+' Z" fill="'+c+'" opacity=".12"/>';
    svg+='<path d="M'+a[0].toFixed(1)+' '+a[1].toFixed(1)+' L'+b[0].toFixed(1)+' '+b[1].toFixed(1)+
         '" fill="none" stroke="'+c+'" stroke-width="2" stroke-linecap="round"/>';
  }
  pts.forEach((p,k)=>{
    const isLast=k===pts.length-1;
    const c=toneColor(k===0?tones[1]:tones[k]);
    svg+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(isLast?3.6:2.3)+
         '" fill="'+(isLast?c:"var(--panel)")+'" stroke="'+c+'" stroke-width="1.8"/>';
    svg+='<text x="'+p[0].toFixed(1)+'" y="'+Math.max(11,p[1]-9).toFixed(1)+
         '" text-anchor="middle" font-size="'+BAR_LABEL_FS+'" font-weight="'+(isLast?"700":"600")+
         '" fill="'+(k===0?"var(--ink-2)":c)+'">'+fmt(metric,series[p[2]])+'</text>';
  });
  }
  /* Hover strips, one per period, carrying the counts tooltip. */
  if(metric.tip && labels){
    const step = n>1 ? (W-padX*2)/(n-1) : W;
    labels.forEach(function(lab,i){
      if(series[i]==null && !(counts&&counts.n[i]!=null)) return;
      const x0=Math.max(0, x(i)-step/2), x1=Math.min(W, x(i)+step/2);
      svg+='<rect class="pt" x="'+x0.toFixed(1)+'" y="0" width="'+(x1-x0).toFixed(1)+'" height="'+base+
           '" fill="transparent" pointer-events="all" data-tip="'+tipHTML(metric, lab, series[i], counts, i, unit)+'"></rect>';
    });
  }
  (labels||[]).forEach((lab,i)=>{
    svg+='<text x="'+x(i).toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle" font-size="'+AXIS_LABEL_FS+'" fill="var(--muted)">'+esc(lab)+'</text>';
  });
  return svg+'</svg>';
}

function lineChart(seriesList, labels, metric, colorMode){
  const all=[]; seriesList.forEach(s=>s.values.forEach(v=>{ if(v!=null) all.push(v); }));
  if(!all.length) return '<div class="state"><h3>No numbers here yet</h3><p>Nothing in this sheet matches the current filters. Widen the region or segment filter.</p></div>';
  const W=1000,H=430,L=62,R=26,T=34,B=42;
  const n=labels.length;
  const sc=makeScale(metric, all, T, H-B);
  const inner=W-L-R, bars=state.chart==="bar";
  const x=i=> bars ? L+inner*(i+0.5)/n
                   : L+(n>1 ? i*inner/(n-1) : inner/2);
  const y=sc.y;
  let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="430" role="img" aria-label="Trend chart">';
  const ticks=5;
  for(let i=0;i<=ticks;i++){
    const v=sc.at(i/ticks), yy=y(v);
    svg+='<line x1="'+L+'" y1="'+yy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+yy.toFixed(1)+'" stroke="var(--hair)" stroke-width="1"'+(i?' stroke-dasharray="3 4"':'')+'/>';
    svg+='<text x="'+(L-10)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+
         (metric.kind==="pct"?v.toFixed(1):(v>=100?Math.round(v):v.toFixed(1)))+'</text>';
  }
  labels.forEach((lab,i)=>{
    svg+='<text x="'+x(i).toFixed(1)+'" y="'+(H-16)+'" text-anchor="middle" font-size="12" font-weight="500" fill="var(--ink-2)">'+esc(lab)+'</text>';
  });
  svg+='<text x="'+(L-10)+'" y="16" text-anchor="end" font-size="10.5" fill="var(--muted)">'+
       (metric.kind==="pct"?"%":"hours")+'</text>';
  const placed=[];
  const byMove = colorMode==="movement";
  if(bars){
    const m=seriesList.length||1;
    const slot=(inner/n) * 0.8;
    const bw=Math.max(2, slot/m);
    seriesList.forEach(function(sr,si){
      const color=sr.color||SERIES_COLORS[si%SERIES_COLORS.length];
      const vals=sr.values;
      vals.forEach(function(v,i){
        if(v==null) return;
        const cx=x(i)-slot/2+bw*si+bw/2, yy=y(v), h=Math.max(1,(H-B)-yy);
        const tone = byMove ? toneColor(stepTone(metric, i>0?vals[i-1]:null, v)) : color;
        svg+='<rect class="pt" x="'+(cx-bw/2+0.8).toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+
             Math.max(1.5,bw-1.6).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="'+tone+'" opacity=".88" '+
             'data-label="'+esc(sr.name)+'" data-x="'+esc(labels[i]||"")+'" data-v="'+esc(fmt(metric,v))+'"></rect>';
        const ly=yy-6;
        if(ly>=14 && !placed.some(q=>Math.abs(q[0]-cx)<40 && Math.abs(q[1]-ly)<12)){
          placed.push([cx,ly]);
          svg+='<text x="'+cx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle" font-size="10.5" '+
               'font-weight="600" fill="'+tone+'">'+esc(fmt(metric,v))+'</text>';
        }
      });
    });
    svg+='</svg>';
    return svg;
  }
  seriesList.forEach((s,si)=>{
    const color=s.color||SERIES_COLORS[si%SERIES_COLORS.length];
    const pts=[];
    s.values.forEach((v,i)=>{ if(v!=null) pts.push([x(i),y(v),i,v]); });
    const tones=pts.map((p,k)=> k===0 ? null : stepTone(metric,pts[k-1][3],p[3]));
    if(byMove){
      for(let k=1;k<pts.length;k++){
        const a=pts[k-1],b=pts[k];
        svg+='<path d="M'+a[0].toFixed(1)+' '+a[1].toFixed(1)+' L'+b[0].toFixed(1)+' '+b[1].toFixed(1)+
             '" fill="none" stroke="'+toneColor(tones[k])+'" stroke-width="2.6" stroke-linecap="round"/>';
      }
    } else if(pts.length>1){
      svg+='<path d="'+pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")+
           '" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    pts.forEach((p,pi)=>{
      const tc = byMove ? toneColor(pi===0?tones[1]:tones[pi]) : color;
      svg+='<circle class="pt" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.5" fill="'+
           (byMove?tc:"var(--panel)")+'" stroke="'+(byMove?"var(--panel)":color)+'" stroke-width="'+(byMove?1.4:2.2)+'" '+
           'data-label="'+esc(s.name)+'" data-x="'+esc(labels[p[2]]||"")+'" data-v="'+esc(fmt(metric,p[3]))+'"></circle>';
      const up = si%2===0;
      const ly = up ? Math.max(16,p[1]-13) : Math.min(H-B-6,p[1]+20);
      const clash = placed.some(q=>Math.abs(q[0]-p[0])<44 && Math.abs(q[1]-ly)<13);
      if(!clash){
        placed.push([p[0],ly]);
        svg+='<text x="'+p[0].toFixed(1)+'" y="'+ly.toFixed(1)+
             '" text-anchor="middle" font-size="11.5" font-weight="600" fill="'+tc+'">'+esc(fmt(metric,p[3]))+'</text>';
      }
    });
  });
  svg+='</svg>';
  return svg;
}

function heatStyle(metric,v,min,max){
  if(v==null||isNaN(v)||max===min) return "background:var(--panel-sunk);color:var(--muted)";
  let t=(v-min)/(max-min);
  if(metric.better==="low") t=1-t;
  const good=[27,122,70], bad=[179,38,30];
  const mix=t*t*(3-2*t);
  const r=Math.round(bad[0]+(good[0]-bad[0])*mix),
        g=Math.round(bad[1]+(good[1]-bad[1])*mix),
        b=Math.round(bad[2]+(good[2]-bad[2])*mix);
  const alpha=0.10+0.20*Math.abs(mix-0.5)*2;
  return "background:rgba("+r+","+g+","+b+","+alpha.toFixed(2)+");color:rgb("+
         Math.round(r*0.65)+","+Math.round(g*0.65)+","+Math.round(b*0.65)+")";
}

const PIPE_STAGES=[
  { id:"proc_queue", label:"Processing Queue",         n:"e2e_n",        c:"var(--s5)" },
  { id:"processing", label:"Processing",               n:"e2e_n",        c:"var(--s1)" },

  { id:"publishing", label:"Publishing",               n:"publishing_n", c:"var(--s2)" },
  { id:"other",      label:"Other",                    n:null,           c:"var(--hair-strong)" }
];
const PIPE_SEG={ all:"All", ent:"Ent", mid:"Mid", resellers:"Resellers", smb:"SMB" };
async function loadPipe(sheet){
  const t=await fetchTable(sheet);
  const labels=t.cols.map(c=>String(c.label||"").trim());
  return t.rows.map(r=>{
    const o={};
    labels.forEach((l,i)=>{ const c=r.c&&r.c[i]; o[l]=c&&c.v!=null&&c.v!=="" ? c.v : null; });
    return o;
  }).filter(o=>o.period);
}
/* Rows for the current segment and region chips; all regions = the widest region_set. */
function pipeRows(){
  const rows=(state.pipes[state.product]||[]).filter(r=>r.segment===PIPE_SEG[state.segment]);
  const rk=regionKey();
  if(rk) return rows.filter(r=>r.region_set===rk);
  const n=r=>r.region_set?String(r.region_set).split(",").length:0, max=Math.max.apply(null,rows.map(n));
  return rows.filter(r=>n(r)===max);
}
/* Monday-start weeks, W-1 = last complete week (same as the cards). */
function pipeRange(per){
  const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7));
  const f=x=>x.toLocaleDateString("en-IN",{day:"2-digit",month:"short"});
  const k=per==="L4W"?4:parseInt(String(per).slice(2),10);
  const a=new Date(d); a.setDate(a.getDate()-7*k);
  const b=new Date(d); b.setDate(b.getDate()-(per==="L4W"?1:7*(k-1)+1));
  return f(a)+" – "+f(b);
}

function glanceHTML(){
  const segLabel=(SEGMENTS.find(s=>s.id===state.segment)||SEGMENTS[0]).label.toLowerCase();
  const periods=periodsOf();
  const latest=periods.length?periods[periods.length-1]:"";
  const lanes=lanesOf(), ms=metricsOf().filter(m=>!state.hiddenCards.has(m.id));

  let html='<div class="sec"><h2>At a glance</h2><span class="note">'+
    esc(isRaw()?periodLabel(latest):periodName(latest))+' \u00b7 '+esc(segLabel)+' \u00b7 change is against the period before it'+
    (state.costLatest ? ' \u00b7 <b style="color:var(--warn)">cost data only to '+
       esc(new Date(state.costLatest+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"}))+
       '</b>' : '')+'</span>'+
    '<div class="sec-tools"><span class="note">Chart</span><div class="seg">'+
      [["line","Line"],["bar","Bar"]].map(o=>'<button data-chart="'+o[0]+'" aria-pressed="'+
        (o[0]===state.chart)+'">'+o[1]+'</button>').join("")+'</div>'+
    '<span class="note" style="margin-left:6px">Scale</span><div class="seg">'+
      [["linear","Linear"],["log","Log"]].map(o=>'<button data-scale="'+o[0]+'" aria-pressed="'+
        (o[0]===state.scale)+'">'+o[1]+'</button>').join("")+'</div>'+
    '<span class="note" style="margin-left:6px">Cards</span>'+
      metricsOf().map(x=>'<button class="chip chip-sm" data-card="'+x.id+'" aria-pressed="'+
        (!state.hiddenCards.has(x.id))+'">'+esc(x.label)+'</button>').join("")+
    '</div></div>';

  /* A single grid, filled row by row, so card N of every lane shares a row and
     therefore a height. Separate per-lane columns could never guarantee that. */
  html+='<div class="lanes" style="--lanes:'+lanes.length+'">';
  lanes.forEach(function(lane){
    html+='<div class="lane-hd"><h3><span class="swatch" style="background:'+lane.color+'"></span>'+
      esc(lane.label)+'</h3><span class="sub">'+esc(lane.blurb)+
      (lane.id==="region"?' \u00b7 '+activeRegions().length+' of '+allRegions().length
        : regionKey() ? (regionSplitMissing(lane.id) ? ' \u00b7 all regions (no region split for this sheet yet)'
                                                     : ' \u00b7 '+esc(activeRegions().join(", "))) : '')+'</span></div>';
  });
  ms.forEach(function(m){
    lanes.forEach(function(lane){
      const series=metricSeries(lane.id,m);
      const t=lastTwo(series), d=fmtDelta(m,t.cur,t.prev);
      const perRegion = lane.id==="region"
        ? activeRegions().map(r=>({ name:r, color:regionColor(r),
                                    values:metricSeries("region",m,null,[r]),
                                    counts:tipCounts("region",m,[r]) }))
        : null;
      const counts=tipCounts(lane.id, m, lane.id==="region"?activeRegions():null);
      html+='<article class="card"><div class="card-top"><span class="name">'+esc(m.label)+
        (lane.id==="region"?' <span style="font-weight:400;color:var(--muted)">'+
          ((m.agg==="sum")?"total":"avg")+'</span>':'')+'</span>'+
        '<span style="display:flex;align-items:center;gap:8px">'+
        (d?'<span class="delta '+d.tone+'">'+d.txt+'</span>':'')+
        '<button class="hide-x" data-card="'+m.id+'" title="Hide this card" aria-label="Hide '+esc(m.label)+'">\u00d7</button>'+
        '</span></div>'+
        '<div class="val num">'+fmt(m,t.cur)+'</div>'+
        '<div class="cmp num">'+(t.prev!=null?"was "+fmt(m,t.prev):"no prior period")+'</div>'+
        (m.combo
           ? sparkCombo(series, m, periods,
               countSeries(lane.id, m.combo.num, null, lane.id==="region"?activeRegions():null),
               countSeries(lane.id, m.combo.den, null, lane.id==="region"?activeRegions():null))
           : (perRegion && perRegion.length
                ? sparkMulti(perRegion,m,periods)
                : sparkline(series,m,periods,counts,lane.tipUnit||null)))+'</article>';
    });
  });
  return html+'</div>';
}

function trendSeries(){
  const m=metricById(state.trendMetric);
  const c=col(m.id);
  const roll = m.agg==="mean"||!m.agg ? " (avg)" : " (total)";
  if(state.trendSplit==="lane")
    return lanesOf().map(l=>({ name:l.label+(l.id==="region"?roll:""), values:metricSeries(l.id,m) }));
  if(state.trendSplit==="segment")
    return SEGMENTS.map(s=>({ name:s.label, values:metricSeries(state.matrixLane,m,s.prefix) }));
  return activeRegions().map(r=>({ name:r, values:metricSeries("region",m,null,[r]) }));
}

      '<td class="num">'+(worst?fmt(m,worst[0])+'  <span style="color:var(--muted)">'+esc(labels[worst[1]]||"")+'</span>':"\u2014")+'</td>'+

      '</div></div>'+
      '<div class="ctl"><span>Split by</span><div class="seg">'+
        [["lane","Cut"],["segment","Segment"],["region","Region"]].map(o=>
          '<button data-split="'+o[0]+'" aria-pressed="'+(o[0]===state.trendSplit)+'">'+o[1]+'</button>').join("")+
      '</div></div>'+
      '<div class="ctl"><span>Colour</span><div class="seg">'+
        [["movement","Movement"],["series","Series"]].map(o=>
          '<button data-cmode="'+o[0]+'" aria-pressed="'+(o[0]===colorMode)+'">'+o[1]+'</button>').join("")+
      '</div></div>'+
    '</div>'+
    (shown.length ? lineChart(shown,labels,m,colorMode)
      : '<div class="state"><h3>Every line is hidden</h3><p>Click a name below to bring it back.</p></div>')+
    '<div class="legend">'+all.map(sr=>'<button class="legend-btn" data-series="'+esc(sr.name)+
      '" aria-pressed="'+(!state.hidden.has(sr.name))+'"><span class="swatch" style="background:'+sr.color+
      '"></span>'+esc(sr.name)+'</button>').join("")+'</div>'+
    '<div class="scroll" style="margin-top:16px;max-height:none"><table class="records"><tr>'+
      '<th>Series</th><th>Latest</th><th>Previous</th><th>Change</th><th>Best period</th><th>Worst period</th></tr>'+
      '<tbody>'+summary+'</tbody></table></div>'+
    '</div>';
}

function recordFields(laneId){
  const rows=raw(laneId);
  const keys=new Set();
  rows.forEach(r=>Object.keys(r.v).forEach(k=>keys.add(k)));
  return [...keys];
}
function recordRows(){
  const laneId=state.recordsLane;
  const dim=(laneById(laneId)||{}).dim;
  let rows=laneSetRows(laneId, raw(laneId)).filter(r=>r.granularity===state.granularity);
  if(dim==="region") rows=rows.filter(r=>activeRegions().includes(r.region));
  const q=state.recordsQuery.trim().toLowerCase();
  if(q) rows=rows.filter(r=>(r.period+" "+(r.region||"")).toLowerCase().includes(q));
  rows.sort((a,b)=>{
    if(state.sortCol){
      const av=a.v[state.sortCol], bv=b.v[state.sortCol];
      if(av==null) return 1; if(bv==null) return -1;
      return (av-bv)*state.sortDir;
    }
    return -comparePeriods(a,b);
  });
  return rows;
}
function recordsHTML(){
  const laneId=state.recordsLane;
  const dim=(laneById(laneId)||{}).dim;
  const fields=recordFields(laneId);
  const rows=recordRows();
  const head='<tr><th>Period</th><th>Date</th>'+(dim?'<th>Region</th>':'')+
    fields.map(f=>'<th class="clickable" data-sort="'+esc(f)+'" style="cursor:pointer">'+esc(f)+
      (state.sortCol===f?(state.sortDir<0?" \u2193":" \u2191"):"")+'</th>').join("")+'</tr>';
  const body=rows.map(r=>'<tr><td style="font-weight:500">'+esc(r.period)+'</td>'+
    '<td class="num" style="color:var(--muted)">'+(r.date?r.date.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"2-digit"}):"\u2014")+'</td>'+
    (dim?'<td>'+esc(r.region||"")+'</td>':'')+
    fields.map(f=>{
      const v=r.v[f];
      return '<td class="num">'+(v==null||isNaN(v)?"\u2014":(Math.abs(v)>=100?Math.round(v).toLocaleString("en-IN"):v.toFixed(2)))+'</td>';
    }).join("")+'</tr>').join("");

  return '<div class="sec"><h2>Records<span class="admin-tag">Admin</span></h2><span class="note">'+rows.length+' row'+(rows.length===1?"":"s")+
    ' from '+esc((laneById(laneId)||{}).sheet||"")+' \u00b7 sorted newest first unless you pick a column</span></div>'+
  '<div class="panel"><div class="panel-hd">'+
    '<div class="rec-tabs">'+lanesOf().map(l=>'<button data-rl="'+l.id+'" aria-pressed="'+(l.id===state.recordsLane)+'">'+esc(l.label)+'</button>').join("")+'</div>'+
    '<div class="ctl"><input class="search" id="recSearch" placeholder="Filter periods or regions" value="'+esc(state.recordsQuery)+'">'+
    '<button class="btn" id="csvBtn" style="background:var(--panel);border-color:var(--hair-strong);color:var(--ink-2)">Download CSV</button></div>'+
  '</div>'+
  '<div class="scroll"><table class="records">'+head+'<tbody>'+
    (rows.length?body:'<tr><td colspan="'+(fields.length+3)+'" style="text-align:center;color:var(--muted);padding:28px">Nothing matches that filter. Clear the search or pick more regions.</td></tr>')+
  '</tbody></table></div></div>';
}

/* ADMIN ONLY - what the sheets actually delivered, for spotting gaps at source. */
function healthHTML(){
  const ms=metricsOf(), cols=ms.filter(m=>m.agg!=="ratio").map(m=>m.id);
  const rows=lanesOf().map(l=>{
    const all=raw(l.id);
    let cells=0, blanks=0;
    all.forEach(r=>SEGMENTS.forEach(sg=>cols.forEach(c=>{
      cells++; const v=r.v[sg.prefix+c]; if(v==null||isNaN(v)) blanks++;
    })));
    const dy=all.filter(r=>r.granularity==="day").length;
    const wk=all.filter(r=>r.granularity==="week").length;
    const mo=all.filter(r=>r.granularity==="month").length;
    const regs=l.dim==="region" ? new Set(all.map(r=>r.region)).size : "\u2014";
    return '<tr><td style="font-weight:500">'+esc(l.label)+'</td>'+
      '<td style="text-align:left;color:var(--muted)">'+esc(laneSheet(l))+'</td>'+
      '<td class="num">'+all.length+'</td><td class="num">'+dy+'</td><td class="num">'+wk+'</td><td class="num">'+mo+'</td>'+
      '<td class="num">'+regs+'</td>'+
      '<td class="num"'+(blanks?' style="color:var(--down);font-weight:600"':'')+'>'+
        blanks+(cells?' <span style="color:var(--muted);font-weight:400">of '+cells+'</span>':'')+'</td></tr>';
  }).join("");
  const acc = state.access
    ? state.access.length+' people in '+ACCESS_FILE+' \u00b7 '+
      state.access.filter(a=>a.role==="admin").length+' admin'
    : 'No '+ACCESS_FILE+' found \u2014 any '+ALLOWED_DOMAINS.join(" / ")+' address can sign in';
  let costDims="";
  if(state.cost){
    const seen={};
    state.cost.forEach(function(r){
      const k="seg:"+r.segment; seen[k]=seen[k]||{v:r.segment,kind:"segment",to:costSegmentOf(r.segment)};
      const g="reg:"+r.region;  seen[g]=seen[g]||{v:r.region,kind:"region",
        to:(allRegions().indexOf(r.region)>=0?r.region:null)};
    });
    const rows=Object.keys(seen).map(k=>seen[k]).map(function(d){
      return '<tr><td style="text-align:left">'+esc(d.kind)+'</td>'+
        '<td style="text-align:left">'+esc(d.v==null?"(blank)":d.v)+'</td>'+
        '<td style="text-align:left'+(d.to?'':';color:var(--down);font-weight:600')+'">'+
        (d.to?esc(d.to):"not mapped \u2014 excluded from that filter")+'</td></tr>';
    }).join("");
    /* Which periods the cost query actually covers, before any filter is
       applied - so a gap on a card can be traced to missing rows vs a filter. */
    const cover={};
    state.cost.forEach(function(r){
      if(!costProductMatch(r.product)) return;
      const k=r.period_type+"|"+r.period;
      const c=cover[k]||(cover[k]={pt:r.period_type,p:r.period,rows:0,images:0,cost:0,segs:{}});
      c.rows++; c.images+=Number(r.images)||0; c.cost+=Number(r.cost)||0;
      const sg=costSegmentOf(r.segment)||"unmapped";
      c.segs[sg]=(c.segs[sg]||0)+1;
    });
    const onScreen=periodsOf();
    const covRows=Object.keys(cover).map(k=>cover[k])
      .filter(c=>c.pt===state.granularity && isShownPeriod(c.p))
      .sort((a,b)=>onScreen.indexOf(a.p)-onScreen.indexOf(b.p))
      .map(function(c){
        const missing=onScreen.indexOf(c.p)<0;
        return '<tr><td style="text-align:left">'+esc(c.p)+(missing?' <span style="color:var(--muted)">(not on screen)</span>':'')+
          '</td><td class="num">'+c.rows+'</td><td class="num">'+c.images.toLocaleString("en-IN")+
          '</td><td class="num">'+fmt({kind:"inr"},c.cost)+'</td>'+
          '<td style="text-align:left;color:var(--muted)">'+esc(Object.keys(c.segs).sort().join(", "))+'</td></tr>';
      }).join("");
    const absent=onScreen.filter(p=>!cover[state.granularity+"|"+p]);
    costDims='<div class="sec"><h2>Cost coverage<span class="admin-tag">Admin</span></h2>'+
      '<span class="note">'+esc(state.product)+' \u00b7 '+esc(state.granularity==="day"?"daily":state.granularity+"ly")+', before segment and region filters'+
      (absent.length?' \u00b7 nothing returned for '+esc(absent.join(", ")):'')+'</span></div>'+
      '<div class="panel" style="margin-bottom:18px"><div class="scroll"><table class="records">'+
      '<tr><th style="text-align:left">Period</th><th>Rows</th><th>Images</th><th>Cost</th>'+
      '<th style="text-align:left">Segments present</th></tr><tbody>'+
      (covRows||'<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:22px">No cost rows for this product</td></tr>')+
      '</tbody></table></div></div>'+
      '<div class="sec"><h2>Cost dimensions<span class="admin-tag">Admin</span></h2>'+
      '<span class="note">What BigQuery returned, and how each value maps onto the filters. '+
      'Anything unmapped goes in segmentMap in config.json.</span></div>'+
      '<div class="panel"><div class="scroll"><table class="records">'+
      '<tr><th style="text-align:left">Field</th><th style="text-align:left">Value from BigQuery</th>'+
      '<th style="text-align:left">Maps to</th></tr><tbody>'+rows+'</tbody></table></div></div>';
  }
  return costDims+'<div class="sec"><h2>Data health<span class="admin-tag">Admin</span></h2>'+
    '<span class="note">What each sheet returned on the last sync. Blanks are missing metric cells, not zeros.</span></div>'+
    '<div class="panel" style="margin-bottom:18px"><div class="panel-hd" style="margin:0">'+
      '<h3>Access</h3><span class="note">'+esc(acc)+'</span></div></div>'+
    '<div class="panel"><div class="scroll" style="max-height:none"><table class="records">'+
    '<tr><th>Cut</th><th style="text-align:left">Sheet</th><th>Rows</th><th>Daily</th><th>Weekly</th><th>Monthly</th><th>Regions</th><th>Blank cells</th></tr>'+
    '<tbody>'+rows+'</tbody></table></div></div>';
}

function loginLogHTML(){
  if(!LOGIN_LOG){
    return '<div class="sec"><h2>Sign-in log<span class="admin-tag">Admin</span></h2></div>'+
      '<div class="panel"><p style="margin:0;font-size:13px;color:var(--muted)">'+
      'Not set up yet \u2014 add a <code>loginLog</code> block to '+CONFIG_FILE+' pointing at a Google Form.'+
      '</p></div>';
  }
  const rows=state.loginLog;
  if(!rows) return '<div class="sec"><h2>Sign-in log<span class="admin-tag">Admin</span></h2></div>'+
    '<div class="panel"><p style="margin:0;font-size:13px;color:var(--muted)">'+
    'Couldn\u2019t read \u201c'+esc(LOGIN_LOG.sheetName||"")+'\u201d. Check the tab name and that the workbook is link-readable.</p></div>';

  const cut=Date.now()-7*864e5;
  const recent=rows.filter(r=>r.at && r.at.getTime()>=cut);
  const people=new Set(recent.map(r=>r.email));
  const body=rows.slice(0,60).map(r=>
    '<tr><td class="num" style="text-align:left">'+
      (r.at ? esc(r.at.toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})) : "\u2014")+
    '</td><td style="text-align:left">'+esc(r.email)+'</td>'+
    '<td style="text-align:left;color:var(--muted)">'+esc(r.role||"\u2014")+'</td></tr>').join("");

  return '<div class="sec"><h2>Sign-in log<span class="admin-tag">Admin</span></h2>'+
    '<span class="note">'+recent.length+' sign-in'+(recent.length===1?"":"s")+' from '+people.size+
    ' '+(people.size===1?"person":"people")+' in the last 7 days \u00b7 showing the most recent '+
    Math.min(60,rows.length)+' of '+rows.length+'</span></div>'+
    '<div class="panel"><div class="scroll"><table class="records">'+
    '<tr><th style="text-align:left">When</th><th style="text-align:left">Account</th><th style="text-align:left">Role</th></tr>'+
    '<tbody>'+(body||'<tr><td colspan="3" style="text-align:center;color:var(--muted);padding:24px">No sign-ins recorded yet</td></tr>')+
    '</tbody></table></div></div>';
}

function footHTML(){
  return '<div class="foot">'+
    (isRaw()
      ? '<span>Source: <a href="'+curProduct().raw.base+'" target="_blank" rel="noopener">360 Tracker dashboard</a> data, '+
          'computed with engine-360.js ('+esc(Engine360.version)+'), the same calculation as its Reports tab</span>'
      : '<span>Source: <a href="'+SHEET_URL+'" target="_blank" rel="noopener">Delivery Metrics workbook</a> \u2014 '+
          esc(lanesOf().map(laneSheet).join(", "))+'</span>')+
    '<span>Percentages are 0\u2013100. TAT is in hours.</span>'+
    '<span>Cost / revenue isn\u2019t in these sheets yet.</span></div>';
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  if(state.srcOpen && !(e.target.closest && e.target.closest("#srcMs"))){ state.srcOpen=false; render(); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && state.srcOpen){ state.srcOpen=false; render(); } });
function wire(){
  const bqb=document.getElementById("bqBtn");
  if(bqb) bqb.onclick=async()=>{
    bqb.textContent="Connecting\u2026"; bqb.disabled=true;
    try{ BQ.token=await bqToken(true); state.costError=null; }
    catch(e){ state.costError="Sign-in for BigQuery didn\u2019t complete."; }
    state.cost=await loadCost();
    render();
  };
  document.querySelectorAll("[data-chart]").forEach(b=>b.onclick=()=>{ state.chart=b.dataset.chart; render(); });
  document.querySelectorAll("[data-scale]").forEach(b=>b.onclick=()=>{ state.scale=b.dataset.scale; render(); });
  document.querySelectorAll("[data-card]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.card;
    if(state.hiddenCards.has(id)) state.hiddenCards.delete(id); else state.hiddenCards.add(id);
    render();
  });
  document.querySelectorAll("[data-gran]").forEach(b=>b.onclick=()=>{ state.granularity=b.dataset.gran; render(); });
  document.querySelectorAll("[data-seg]").forEach(b=>b.onclick=()=>{ state.segment=b.dataset.seg; render(); });
  document.querySelectorAll("[data-pp]").forEach(b=>b.onclick=()=>{ state.pipePeriod=b.dataset.pp; render(); });
  /* 360 Validation Failed mode: switch to the other set of lane sheets, loading them the first time. */
  document.querySelectorAll("[data-vf]").forEach(b=>b.onclick=()=>{
    state.includeVF = b.dataset.vf==="1";
    if(lanesOf().every(l=>state.data[key(l.id)])){ render(); ensureByRegion().then(loaded=>{ if(loaded) render(); }); }
    else loadAll();
  });
  document.querySelectorAll("[data-region]").forEach(b=>b.onclick=()=>{
    const r=b.dataset.region;
    if(regSet().has(r)) regSet().delete(r); else regSet().add(r);
    if(state.drillRegion&&!regSet().has(state.drillRegion)) state.drillRegion=null;
    if(isRaw()) computeRaw();
    render();
    ensureByRegion().then(loaded=>{ if(loaded) render(); });
  });
  const ra=document.getElementById("regAll");
  if(ra) ra.onclick=()=>{
    const all=allRegions();
    if(regSet().size===all.length) regSet().clear(); else all.forEach(r=>regSet().add(r));
    if(isRaw()) computeRaw();
    render();
    ensureByRegion().then(loaded=>{ if(loaded) render(); });
  };
  /* 360 raw filters: Input Type capsules and the Source dropdown narrow the spins, then the lanes
     are recomputed (the dropdown stays open while ticking). */
  document.querySelectorAll("[data-rtype]").forEach(b=>b.onclick=()=>{
    const s=state.rawTypes[state.product], t=b.dataset.rtype;
    if(s.has(t)) s.delete(t); else s.add(t);
    computeRaw(); render();
  });
  const ip=document.getElementById("issPeriod");
  if(ip) ip.onchange=()=>{ state.issuesPeriod[state.product]=ip.value; render(); };
  const sb=document.getElementById("srcBtn");
  if(sb) sb.onclick=(e)=>{ e.stopPropagation(); state.srcOpen=!state.srcOpen; render(); };
  document.querySelectorAll("[data-rsrc]").forEach(cb=>cb.onchange=()=>{
    const s=state.rawSources[state.product], t=cb.dataset.rsrc;
    if(cb.checked) s.add(t); else s.delete(t);
    computeRaw(); render();
  });
  document.querySelectorAll("[data-srcact]").forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const s=state.rawSources[state.product];
    if(b.dataset.srcact==="all") rawAll('source').forEach(x=>s.add(x)); else s.clear();
    computeRaw(); render();
  });
  document.querySelectorAll("[data-tm]").forEach(b=>b.onclick=()=>{ state.trendMetric=b.dataset.tm; render(); });
  document.querySelectorAll("[data-split]").forEach(b=>b.onclick=()=>{ state.trendSplit=b.dataset.split; state.hidden.clear(); render(); });
  document.querySelectorAll("[data-cmode]").forEach(b=>b.onclick=()=>{ state.colorMode=b.dataset.cmode; render(); });
  document.querySelectorAll("[data-series]").forEach(b=>b.onclick=()=>{
    const n=b.dataset.series;
    if(state.hidden.has(n)) state.hidden.delete(n); else state.hidden.add(n);
    render();
  });
  document.querySelectorAll("[data-mm]").forEach(b=>b.onclick=()=>{ state.matrixMetric=b.dataset.mm; render(); });
  document.querySelectorAll("[data-ml]").forEach(b=>b.onclick=()=>{ state.matrixLane=b.dataset.ml; render(); });
  document.querySelectorAll("[data-rl]").forEach(b=>b.onclick=()=>{ state.recordsLane=b.dataset.rl; state.sortCol=null; render(); });
  document.querySelectorAll("[data-drill]").forEach(tr=>tr.onclick=()=>{
    state.drillRegion = state.drillRegion===tr.dataset.drill ? null : tr.dataset.drill; render();
  });
  const dc=document.getElementById("drillClose");
  if(dc) dc.onclick=(e)=>{ e.stopPropagation(); state.drillRegion=null; render(); };
  document.querySelectorAll("[data-sort]").forEach(th=>th.onclick=()=>{
    const f=th.dataset.sort;
    if(state.sortCol===f) state.sortDir*=-1; else { state.sortCol=f; state.sortDir=-1; }
    render();
  });
  const rs=document.getElementById("recSearch");
  if(rs) rs.oninput=()=>{
    state.recordsQuery=rs.value;
    const at=rs.selectionStart; render();
    const el=document.getElementById("recSearch");
    if(el){ el.focus(); el.setSelectionRange(at,at); }
  };
  const csv=document.getElementById("csvBtn");
  if(csv) csv.onclick=downloadCSV;

  /* chart tooltips */
  const tip=document.getElementById("tip");
  document.querySelectorAll(".pt").forEach(c=>{
    c.addEventListener("mouseenter",e=>{
      tip.innerHTML = c.dataset.tip ? c.dataset.tip
        : ("<b>"+c.dataset.v+"</b> \u00b7 "+c.dataset.label+"<br>"+c.dataset.x);
      tip.style.opacity="1";
    });
    c.addEventListener("mousemove",e=>{
      tip.style.left=(e.clientX+14)+"px"; tip.style.top=(e.clientY-46)+"px";
    });
    c.addEventListener("mouseleave",()=>{ tip.style.opacity="0"; });
  });
}

function downloadCSV(){
  const laneId=state.recordsLane, dim=(laneById(laneId)||{}).dim;
  const fields=recordFields(laneId), rows=recordRows();
  const head=["period","date"].concat(dim?["region"]:[]).concat(fields);
  const lines=[head.join(",")].concat(rows.map(r=>{
    const base=[r.period, r.date?r.date.toISOString().slice(0,10):""].concat(dim?[r.region||""]:[]);
    return base.concat(fields.map(f=>r.v[f]==null?"":r.v[f])).map(c=>{
      const s=String(c);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(",");
  }));
  const blob=new Blob([lines.join("\n")],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=laneId+"_"+state.granularity+"_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a); a.click(); a.remove();
}

document.getElementById("refreshBtn").onclick=loadAll;
/* The masthead condenses once you scroll so the frozen bar stays slim. */
/* Collapsing the header shortens the page, which can scroll you back above the
   trigger and expand it again - hence the gap between the two thresholds. */
let mastCompact=false, stickyQueued=false;
window.addEventListener("scroll",function(){
  const y=window.scrollY;
  if(!mastCompact && y>90) mastCompact=true;
  else if(mastCompact && y<30) mastCompact=false;
  else return;
  const m=document.querySelector(".mast");
  if(!m) return;
  m.classList.toggle("compact",mastCompact);
  if(!stickyQueued){
    stickyQueued=true;
    requestAnimationFrame(function(){ stickyQueued=false; syncSticky(); });
  }
},{passive:true});
window.addEventListener("resize",syncSticky);
syncSticky();
loadConfig().then(function(){ if(restoreSession()) showApp(); else showGate(); });
</script>
